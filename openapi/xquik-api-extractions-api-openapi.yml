    ExtractionRequest:
      description: One synchronous estimate or asynchronous extraction request.
      type: object
      required:
      - toolType
      properties:
        toolType:
          $ref: '#/components/schemas/ExtractionToolType'
        targetTweetId:
          type: string
        targetUsername:
          type: string
        targetCommunityId:
          type: string
          description: Required for community_post_extractor & community_search.
        targetListId:
          type: string
          description: Required for list_follower_explorer, list_member_extractor & list_post_extractor.
        targetSpaceId:
          type: string
          description: Required for space_explorer.
        targetTweetIds:
          type: array
          minItems: 1
          maxItems: 10000
          uniqueItems: true
          items:
            type: string
          description: Tweet IDs processed as one collection job.
        targetUsernames:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
          description: Usernames processed as one collection job.
        targetCommunityIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
          description: Community IDs processed as one collection job.
        targetListIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
          description: List IDs processed as one collection job.
        searchQueries:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
          description: Search queries processed as one collection job.
        targets:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/ExtractionMixedTarget'
          description: Mixed targets auto-routed within one job.
        relationTargets:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ExtractionRelationTarget'
          description: Profile relations processed within one job.
        queryType:
          type: string
          enum:
          - Latest
          - Top
          - Both
          default: Latest
          description: Search ranking applied to every query.
        maxItemsPerTarget:
          type: integer
          minimum: 1
          description: Maximum results collected for each target.
        maxPagesPerTarget:
          type: integer
          minimum: 1
          maximum: 1000
          description: Reply pages collected for each target.
        startCursor:
          type: string
          minLength: 1
          description: Resume one reply target from this cursor.
        dedupeAcrossTargets:
          type: boolean
          default: true
          description: Merge duplicate results across collection targets.
        dedupeMode:
          type: string
          enum:
          - none
          - first
          - merge
          description: Keep target duplicates, first rows, or merged overlap.
        overlapMode:
          type: boolean
          default: false
          description: Shortcut for dedupeMode=merge.
        includeSearchTerms:
          type: boolean
          default: false
          description: Add matching search terms to collection metadata.
        includeTargetMetadata:
          type: boolean
          default: true
          description: Add source target metadata to each result.
        collectionStrategy:
          type: string
          enum:
          - auto
          - complete
          - direct
          - search
          - thread
          default: auto
          description: Reply collection strategy.
        scope:
          type: string
          enum:
          - all
          - direct
          - nested
          default: all
          description: Reply depth scope.
        maxDepth:
          type: integer
          minimum: 1
          description: Maximum nested reply depth.
        sort:
          type: string
          enum:
          - relevance
          - latest
          - oldest
          - likes
          default: relevance
          description: Reply result order.
        excludeOriginalAuthor:
          type: boolean
          default: false
          description: Exclude replies from the source author.
        includeOriginalPost:
          type: boolean
          default: false
          description: Include the source post in reply results.
        hasMediaOnly:
          type: boolean
          default: false
          description: Return only replies with media.
        sinceTime:
          oneOf:
          - type: string
            format: date-time
          - type: integer
          description: Reply start time as ISO 8601 or Unix seconds.
        untilTime:
          oneOf:
          - type: string
            format: date-time
          - type: integer
          description: Reply end time as ISO 8601 or Unix seconds.
        minViews:
          type: integer
          minimum: 0
          description: Minimum Tweet view count.
        minBookmarks:
          type: integer
          minimum: 0
          description: Minimum Tweet bookmark count.
        maxLikes:
          type: integer
          minimum: 0
          description: Maximum Tweet like count.
        maxRetweets:
          type: integer
          minimum: 0
          description: Maximum Tweet repost count.
        maxReplies:
          type: integer
          minimum: 0
          description: Maximum Tweet reply count.
        maxQuotes:
          type: integer
          minimum: 0
          description: Maximum Tweet quote count.
        blueVerifiedOnly:
          type: boolean
          default: false
          description: Return only Blue-verified Tweet authors.
        cardName:
          type: string
          description: Match the Tweet card name.
        source:
          type: string
          description: Match the source application.
        excludeSource:
          type: string
          description: Exclude a source application.
        geocode:
          type: string
          description: Match latitude, longitude, and radius.
