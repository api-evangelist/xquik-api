openapi: 3.2.0
info:
  title: Xquik Extractions API
  version: '1.0'
  description: Xquik is an independent third-party service.
  x-guidance: '## Common tasks


    **Find a tweet** - GET /x/tweets/{id}. Returns text, author, metrics, media, and creation time. Cost: $0.00015 per lookup.


    **Search tweets** - GET /x/tweets/search?q={query}&limit={n}. Supports X operators, structured filters, Tweet IDs, and status URLs. Omit mode for automatic coverage. Cost: $0.00015 per returned tweet.


    **Find a user** - GET /x/users/{id}. Accepts an ID or username. Cost: $0.00015 per lookup.


    **Check if A follows B** - GET /x/followers/check?source={a}&target={b}. Accepts usernames or profile URLs. Cost: $0.00075.


    **Get trends** - GET /trends?woeid={region}&count={n}. WOEID 1 is worldwide. Cost: $0.00045.


    **Download media** - POST /x/media/download with `tweetIds`. Fresh Tweets cost 1 credit each. Cached repeats are free.


    **Read an article** - GET /x/articles/{tweetId}. Cost: $0.00075.


    ## Pagination


    Default platform pages return `hasMore` and `nextCursor`. X pages return `has_next_page` and `next_cursor`. The 2026-04-29 contract returns `has_more` and `next_cursor`. Pass cursors through `cursor`; `after` remains compatible. Dynamic pricing counts returned items, not requests.


    Omit `mode` for automatic reads. Pass cursors unchanged. `mode=standard` remains legacy. Retry 409 responses after `Retry-After`. Restart 410 responses without a cursor.


    ## Authentication


    Eligible reads accept guest wallets. Fixed-price lookups also accept MPP. Other features require an API key or OAuth 2.1 bearer token. API keys also support `Authorization: Bearer xq_...`.


    ## Best-Practice Response Contract


    v1 remains the default. Send `xquik-api-contract: 2026-04-29` for snake_case, Unix timestamps, structured errors, unified pagination, resource objects, and prefixed IDs. Dependency failures use 424 instead of 502.'
  contact:
    name: Xquik
    url: https://xquik.com
    email: support@xquik.com
servers:
- url: https://xquik.com
security:
- apiKey: []
- oauthBearer: []
tags:
- name: Extractions
  description: Bulk data extraction (23 tool types)
paths:
  /api/v1/extractions:
    get:
      operationId: listExtractions
      summary: List extraction jobs
      tags:
      - Extractions
      security:
      - apiKey: []
      - oauthBearer: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      - name: toolType
        in: query
        description: Filter by extraction tool type
        schema:
          $ref: '#/components/schemas/ExtractionToolType'
      - name: status
        in: query
        description: Filter by job status
        schema:
          type: string
          enum:
          - running
          - completed
          - failed
      responses:
        '200':
          description: Extraction job list
          content:
            application/json:
              schema:
                type: object
                required:
                - extractions
                - hasMore
                properties:
                  extractions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExtractionJob'
                    example: []
                  hasMore:
                    type: boolean
                    example: false
                  nextCursor:
                    type: string
                    example: abc123
              example:
                extractions: []
                hasMore: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: List extraction jobs.
    post:
      operationId: createExtraction
      summary: Run extraction
      tags:
      - Extractions
      security:
      - apiKey: []
      - oauthBearer: []
      parameters:
      - name: dry_run
        in: query
        description: Estimate cost without creating an extraction.
        schema:
          type: boolean
          default: false
        example: true
      requestBody:
        required: true
        description: Tool type and target identifier (tweet, user, community, list, or search query).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionRequest'
            example:
              toolType: follower_explorer
              targetUsername: elonmusk
      responses:
        '200':
          description: Dry-run estimate
          content:
            application/json:
              schema:
                type: object
                required:
                - allowed
                - creditsAvailable
                - creditsRequired
                - estimatedResults
                - source
                properties:
                  allowed:
                    type: boolean
                  creditsAvailable:
                    type: string
                  creditsRequired:
                    type: string
                  estimatedResults:
                    type: integer
                  resolvedXUserId:
                    type: string
                  source:
                    type: string
              example:
                allowed: true
                creditsAvailable: '10000'
                creditsRequired: '1000'
                estimatedResults: 1000
                source: profile
        '202':
          description: Extraction started
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - toolType
                - status
                properties:
                  id:
                    type: string
                    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  toolType:
                    $ref: '#/components/schemas/ExtractionToolType'
                    example: follower_explorer
                  status:
                    type: string
                    const: running
                    example: running
              example:
                id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                toolType: follower_explorer
                status: running
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '424':
          $ref: '#/components/responses/XApiError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/XApiError'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Run extraction.
  /api/v1/extractions/estimate:
    post:
      operationId: estimateExtraction
      summary: Estimate extraction cost
      tags:
      - Extractions
      security:
      - apiKey: []
      - oauthBearer: []
      requestBody:
        required: true
        description: Same parameters as a real extraction; returns estimated credit cost without running the job.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionRequest'
            example:
              toolType: follower_explorer
              targetUsername: elonmusk
      responses:
        '200':
          description: Extraction estimate
          content:
            application/json:
              schema:
                type: object
                required:
                - estimatedResults
                - creditsRequired
                - creditsAvailable
                - allowed
                - source
                properties:
                  estimatedResults:
                    type: integer
                    example: 500
                  creditsRequired:
                    type: string
                    example: '500'
                  creditsAvailable:
                    type: string
                    example: '50000'
                  allowed:
                    type: boolean
                    example: true
                  source:
                    type: string
                    enum:
                    - followers
                    - following
                    - collection
                    - paginationCap
                    - posts
                    - quoteCount
                    - replyCount
                    - resultsLimit
                    - retweetCount
                    - unknown
                    example: replyCount
                  resolvedXUserId:
                    type: string
                    example: '123456'
              example:
                estimatedResults: 500
                creditsRequired: '500'
                creditsAvailable: '50000'
                allowed: true
                source: replyCount
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Estimate extraction cost.
  /api/v1/extractions/{id}:
    get:
      operationId: getExtraction
      summary: Get extraction results
      tags:
      - Extractions
      security:
      - apiKey: []
      - oauthBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Extraction public ID (UUID)
      - name: limit
        in: query
        description: Maximum number of results to return (1-1000, default 100)
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - $ref: '#/components/parameters/After'
      - name: outputMode
        in: query
        description: Select compact, full, or raw-compatible result fields.
        schema:
          type: string
          enum:
          - compact
          - full
          - raw
          default: full
      - name: outputPreset
        in: query
        description: Keep enrichment nested or merge it into each result.
        schema:
          type: string
          enum:
          - nested
          - flat
          default: nested
      - name: fieldStyle
        in: query
        description: Preserve source keys or convert result field names.
        schema:
          type: string
          enum:
          - source
          - camelCase
          - snake_case
          default: source
      - name: includeRaw
        in: query
        deprecated: true
        description: Use outputMode=raw instead.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Extraction job with results
          content:
            application/json:
              schema:
                type: object
                required:
                - job
                - results
                - hasMore
                properties:
                  job:
                    type: object
                    additionalProperties: true
                    x-stainless-any: true
                    description: Extraction job metadata - shape varies by tool type (JSON)
                    x-stainless-terraform-type: string
                    example:
                      id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      toolType: follower_explorer
                      status: completed
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    example: []
                  hasMore:
                    type: boolean
                    example: false
                  nextCursor:
                    type: string
                    example: abc123
              example:
                job:
                  id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  toolType: follower_explorer
                  status: completed
                results: []
                hasMore: false
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Get extraction results.
  /api/v1/extractions/{id}/export:
    get:
      operationId: exportExtraction
      summary: Export extraction results
      tags:
      - Extractions
      security:
      - apiKey: []
      - oauthBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Extraction public ID
      - name: format
        in: query
        required: true
        description: Export file format
        schema:
          type: string
          enum:
          - csv
          - json
          - md
          - md-document
          - pdf
          - txt
          - xlsx
      - name: minFollowers
        in: query
        schema:
          type: integer
        description: Minimum follower count.
      - name: maxFollowers
        in: query
        schema:
          type: integer
        description: Maximum follower count.
      - name: minFollowing
        in: query
        schema:
          type: integer
        description: Minimum following count.
      - name: maxFollowing
        in: query
        schema:
          type: integer
        description: Maximum following count.
      - name: minPosts
        in: query
        schema:
          type: integer
        description: Minimum post count.
      - name: maxPosts
        in: query
        schema:
          type: integer
        description: Maximum post count.
      - name: minLikes
        in: query
        schema:
          type: integer
        description: Minimum like count.
      - name: minReplies
        in: query
        schema:
          type: integer
        description: Minimum reply count.
      - name: minRetweets
        in: query
        schema:
          type: integer
        description: Minimum repost count.
      - name: minViews
        in: query
        schema:
          type: integer
        description: Minimum view count.
      - name: hasDescription
        in: query
        schema:
          type: boolean
        description: Require a non-empty description.
      - name: hasLocation
        in: query
        schema:
          type: boolean
        description: Require a non-empty location.
      - name: hasMedia
        in: query
        schema:
          type: boolean
        description: Require media.
      - name: verified
        in: query
        schema:
          type: boolean
        description: Filter by verified status.
      - name: lang
        in: query
        schema:
          type: string
        description: Filter by language code.
      - name: search
        in: query
        schema:
          type: string
        description: Search exported result text.
      - name: sinceDate
        in: query
        schema:
          type: string
          format: date
        description: Include results on or after this date.
      - name: untilDate
        in: query
        schema:
          type: string
          format: date
        description: Include results on or before this date.
      responses:
        '200':
          description: Exported file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Export extraction results.
components:
  responses:
    PaymentRequired:
      description: 'Payment required. MPP reads return a problem document and `WWW-Authenticate`. Authenticated reads return balances and checkout actions. Guest keys receive only the guest top-up action. Other endpoints may use legacy errors. A failed request never creates checkout. Require user confirmation before creating one.

        '
      headers:
        WWW-Authenticate:
          description: MPP payment challenge for eligible anonymous pay-per-use requests. Authenticated credit or subscription errors omit this header.
          schema:
            type: string
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/XWritePaymentRequired'
            - $ref: '#/components/schemas/AuthenticatedPaymentRequired'
            - $ref: '#/components/schemas/GuestPaymentRequired'
            - allOf:
              - $ref: '#/components/schemas/Error'
              - not:
                  required:
                  - payment_options
          example:
            balance: '0'
            dashboard: /dashboard/account
            error: insufficient_credits
            message: Insufficient credits. Top up or subscribe to continue.
            next_step: Ask the user to confirm a payment option before creating checkout.
            payment_options:
              credits:
                create_checkout:
                  body:
                    dollars: 10
                    locale: en
                  creates: checkout_url
                  method: POST
                  path: /api/v1/credits/topup
                  provider: stripe
                  requires_authentication: true
                  requires_user_confirmation: true
                  response_url_field: url
              subscription:
                create_checkout:
                  body:
                    tier: starter
                  creates: checkout_url
                  method: POST
                  path: /api/v1/subscribe
                  provider: stripe
                  requires_authentication: true
                  requires_user_confirmation: true
                  response_url_field: url
            required: '1'
            top_up_endpoint: /api/v1/credits/topup
            top_up_url: POST /api/v1/credits/topup
        application/problem+json:
          schema:
            $ref: '#/components/schemas/MppPaymentRequired'
          example:
            account_required: false
            challengeId: Opaque MPP challenge identifier
            detail: Payment is required.
            hint: Use a supported wallet with an offer from the WWW-Authenticate header.
            status: 402
            title: Payment Required
            type: https://paymentauth.org/problems/payment-required
            next_step: Ask the user to confirm a USD amount before creating checkout.
            payment_options:
              guest_wallet:
                create_checkout:
                  account_required: false
                  amount_bounds:
                    currency: usd
                    maximum_minor: 25000
                    minimum_minor: 1000
                  body:
                    amount_minor: 1000
                    currency: usd
                  creates: checkout_url
                  method: POST
                  path: /api/v1/guest-wallets
                  provider: stripe
                  required_headers:
                    Idempotency-Key: <cryptographically random UUID v4>
                  requires_authentication: false
                  requires_user_confirmation: true
                  requires_user_interaction: true
                  response_fields:
                  - checkout_url
                  - api_key
                  - status_url
                  response_url_field: checkout_url
    InvalidInput:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_input
            message: Invalid input. Check the request body.
    XApiError:
      description: 'Dependency unavailable, unauthorized, or rate limited. Default v1 returns 502. The best-practice response contract returns 424 for transparent dependency failures.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: x_api_unavailable
            message: X data source temporarily unavailable. Try again later.
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: Resource not found.
    Unauthenticated:
      description: Unauthenticated
      headers:
        Cache-Control:
          description: Prevents storage of authentication responses.
          schema:
            type: string
            const: no-store
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
            const: Bearer realm="xquik"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthenticated
            message: Authentication required. Provide a valid API key or bearer token.
    RateLimitExceeded:
      description: 'Xquik tier rate limit exceeded. The response includes a `Retry-After` header with the number of seconds to wait before retrying.

        '
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                retryAfter:
                  type: integer
                  example: 60
          example:
            error: rate_limit_exceeded
            message: Too many requests. Try again later.
            retryAfter: 60
      headers:
        Retry-After:
          description: Seconds until the next permitted request.
          schema:
            example: 60
            minimum: 1
            type: integer
    UnexpectedError:
      content:
        application/json:
          example:
            error: internal_error
            message: Unexpected error. Try again.
          schema:
            $ref: '#/components/schemas/Error'
      description: Unexpected error.
  schemas:
    XWriteActionTarget:
      type:
      - object
      - 'null'
      description: Existing X resource targeted by the write, when applicable.
      additionalProperties: false
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - tweet
          - user
          - community
        id:
          type: string
    ExtractionToolType:
      description: Identifier for the extraction tool used to run a job.
      type: string
      enum:
      - article_extractor
      - community_extractor
      - community_moderator_explorer
      - community_post_extractor
      - community_search
      - favoriters
      - follower_explorer
      - following_explorer
      - list_follower_explorer
      - list_member_extractor
      - list_post_extractor
      - mention_extractor
      - people_search
      - post_extractor
      - quote_extractor
      - reply_extractor
      - repost_extractor
      - space_explorer
      - thread_extractor
      - tweet_search_extractor
      - user_likes
      - user_media
      - verified_follower_explorer
    GuestWalletTopupCheckoutAction:
      description: Explicit direct REST action for a guest wallet top-up.
      type: object
      additionalProperties: false
      required:
      - account_required
      - amount_bounds
      - body
      - creates
      - method
      - path
      - provider
      - required_headers
      - requires_authentication
      - requires_user_confirmation
      - requires_user_interaction
      - response_fields
      - response_url_field
      properties:
        account_required:
          type: boolean
          const: false
        amount_bounds:
          $ref: '#/components/schemas/GuestWalletAmountBounds'
        body:
          $ref: '#/components/schemas/GuestWalletPurchaseRequest'
        creates:
          type: string
          const: checkout_url
        method:
          type: string
          const: POST
        path:
          type: string
          const: /api/v1/guest-wallets/topups
        provider:
          type: string
          deprecated: true
          const: stripe
        required_headers:
          type: object
          additionalProperties: false
          required:
          - Idempotency-Key
          properties:
            Idempotency-Key:
              type: string
              const: <cryptographically random UUID v4>
        requires_authentication:
          type: boolean
          const: true
        requires_user_confirmation:
          type: boolean
          const: true
        requires_user_interaction:
          type: boolean
          const: true
        response_fields:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
          - type: string
            const: checkout_url
          - type: string
            const: status_url
          items:
            type: string
            enum:
            - checkout_url
            - status_url
        response_url_field:
          type: string
          const: checkout_url
    ExtractionMixedTarget:
      description: One auto-routed target in a mixed Tweet collection.
      oneOf:
      - type: string
        description: 'X URL, numeric Tweet ID, @username, kind:value target, or search.

          '
      - type: object
        required:
        - kind
        - value
        properties:
          kind:
            type: string
            enum:
            - favoriters
            - list
            - profile
            - profile_likes
            - profile_media
            - profile_replies
            - quotes
            - replies
            - retweeters
            - search
            - thread
            - tweet
          value:
            type: string
            minLength: 1
    XWriteActionResult:
      type:
      - object
      - 'null'
      description: Confirmed result produced by the write, when available.
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - tweet
          - direct_message
          - media
          - community
          - state_change
        id:
          type: string
        state:
          type: string
    XWritePaymentRequired:
      allOf:
      - $ref: '#/components/schemas/XWriteAction'
      - type: object
        required:
        - error
        - message
      description: 'Durable failed write action with the applicable payment guidance.

        '
    XWriteAction:
      type: object
      required:
      - object
      - id
      - writeActionId
      - action
      - status
      - terminal
      - retryable
      - safeToRetry
      - statusUrl
      - pollAfterMs
      - charged
      - chargedCredits
      - billing
      - request
      - account
      - target
      - targetId
      - result
      - nextAction
      - sendDispatched
      - success
      properties:
        object:
          type: string
          const: x_write_action
        id:
          type: string
        writeActionId:
          type: string
        action:
          type: string
          enum:
          - create_tweet
          - delete_tweet
          - like
          - unlike
          - retweet
          - unretweet
          - follow
          - unfollow
          - remove_follower
          - send_dm
          - upload_media
          - update_profile
          - update_avatar
          - update_banner
          - create_community
          - delete_community
          - join_community
          - leave_community
        status:
          type: string
          enum:
          - accepted
          - dispatching
          - pending_confirmation
          - success
          - failed
          - expired
        terminal:
          type: boolean
        retryable:
          type: boolean
          description: True only when a new attempt can reasonably succeed.
        safeToRetry:
          type: boolean
          description: 'True only when no write was dispatched and a new idempotency key may be used.

            '
        statusUrl:
          type: string
        pollAfterMs:
          type:
          - integer
          - 'null'
          minimum: 0
        charged:
          type: boolean
        chargedCredits:
          type: string
          pattern: ^\d+$
        billing:
          $ref: '#/components/schemas/XWriteActionBilling'
        request:
          $ref: '#/components/schemas/XWriteActionRequest'
        account:
          $ref: '#/components/schemas/XWriteActionAccount'
        target:
          $ref: '#/components/schemas/XWriteActionTarget'
        targetId:
          type:
          - string
          - 'null'
        result:
          $ref: '#/components/schemas/XWriteActionResult'
        nextAction:
          $ref: '#/components/schemas/XWriteActionNextAction'
        requestHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        requestId:
          type: string
        idempotent:
          type: boolean
        error:
          type: string
        message:
          type: string
        sendDispatched:
          type: boolean
        sendDispatchedAt:
          type: string
          format: date-time
