        message:
          type: string
          description: Human-readable error guidance.
        reason:
          type: string
          description: Machine-readable reason for a login cooldown.
        retryAfter:
          type: integer
          minimum: 1
          description: Seconds until the next permitted request.
        retryAfterMs:
          type: integer
          minimum: 1
          description: Required wait in milliseconds.
    EventDetail:
      description: Full monitor event including payload data and optional X event ID.
      type: object
      required:
      - id
      - type
      - monitorId
      - monitorType
      - occurredAt
      - data
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/EventType'
        username:
          type: string
          description: Account username for this detailed monitor event.
        query:
          type: string
          description: Keyword query for this detailed monitor event.
        monitorId:
          type: string
          description: Monitor ID associated with this detailed event payload.
        monitorType:
          type: string
          enum:
          - account
          - keyword
          description: Source monitor type for this detailed event.
        keywordMonitorId:
          type: string
          description: Keyword monitor ID included on detailed keyword events.
        occurredAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
          x-stainless-any: true
          description: Event payload - shape varies by event type (JSON)
          x-stainless-terraform-type: string
        xEventId:
          type: string
    EventType:
      description: Type of monitor event fired when account activity occurs.
      type: string
      enum:
      - tweet.new
      - tweet.reply
      - tweet.retweet
      - tweet.quote
      - tweet.media
      - tweet.link
      - tweet.poll
      - tweet.mention
      - tweet.hashtag
      - tweet.longform
      - profile.avatar.changed
      - profile.banner.changed
      - profile.name.changed
      - profile.username.changed
      - profile.bio.changed
      - profile.location.changed
      - profile.url.changed
      - profile.verified.changed
      - profile.protected.changed
      - profile.pinned_tweet.changed
      - profile.unavailable.changed
    Event:
      description: Monitor event summary with source metadata and occurrence time.
      type: object
      required:
      - id
      - type
      - monitorId
      - monitorType
      - occurredAt
      - data
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/EventType'
        username:
          type: string
          description: Account username, present for account monitor events.
        query:
          type: string
          description: Keyword query, present for keyword monitor events.
        monitorId:
          type: string
          description: Account monitor ID for account events, or keyword monitor ID for keyword events.
        monitorType:
          type: string
          enum:
          - account
          - keyword
          description: Source monitor type.
        keywordMonitorId:
          type: string
          description: Keyword monitor ID, present for keyword monitor events.
        occurredAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: 'Xquik API key passed through the x-api-key header. Xquik-Api-Key is a vendor-prefixed alias. API keys beginning with xq_ can also use Authorization: Bearer.'
    oauthBearer:
      type: http
      scheme: bearer
      description: 'OAuth 2.1 access token passed through Authorization: Bearer. Values beginning with xq_ remain Xquik API-key credentials, not OAuth tokens.'
    cookieSession:
      type: apiKey
      in: cookie
      name: __Host-xquik_session
      description: Secure Xquik browser session cookie.
