          description: Public media URL when the upload creates one.
        communityId:
          type: string
          description: Compatibility field for a confirmed community ID.
        communityName:
          type: string
          description: Confirmed community name when available.
        resultId:
          type: string
          description: Compatibility result ID for other write actions.
        media:
          type: object
          additionalProperties: true
          description: Media count, kind, size, and billing details when used.
        details:
          type: object
          additionalProperties: true
          description: Structured recovery context for a failed write.
        success:
          type: boolean
      description: 'Durable write lifecycle record. Poll statusUrl until terminal is true. Reusing the original Idempotency-Key returns this same record. Submit a new write only when safeToRetry is true, using a new key.

        '
    PaginatedTweets:
      description: 'No-mode search, user Tweet, user reply, and direct reply reads use automatic coverage. Shape, filters, aliases, and billing stay compatible. Unprefixed cursors remain legacy. Follow next_cursor while has_next_page is true. An empty filtered page can still have has_next_page true.

        '
      type: object
      required:
      - tweets
      - has_next_page
      - next_cursor
      properties:
        tweets:
          type: array
          items:
            $ref: '#/components/schemas/SearchTweet'
        has_next_page:
          type: boolean
        next_cursor:
          type: string
    TweetReplies:
      description: 'Direct reply rows. No-mode requests use resumable automatic coverage. Complete mode also returns nested replies and coverage diagnostics. Keep nested replies separate from direct coverage.

        '
      allOf:
      - $ref: '#/components/schemas/PaginatedTweets'
      - type: object
        properties:
          nested_replies:
            type: array
            items:
              $ref: '#/components/schemas/SearchTweet'
            description: Nested replies. Excluded from direct coverage.
          diagnostic:
            $ref: '#/components/schemas/ReplyCoverageDiagnostic'
    ReplyCoverageDiagnostic:
      description: Evidence for direct-reply coverage and collector behavior.
      type: object
      required:
      - complete
      - reportedReplyCount
      - targetDirectReplies
      - uniqueDirectReplies
      - coveragePercentage
      - nestedReplyCount
      - pagesAttempted
      - strategiesAttempted
      - duplicateCount
      - cursorFailures
      - repeatedCursorCount
      - emptyFalseProgressPages
      - malformedCount
      - unrelatedCount
      - missingResponseModulesOrFields
      - recommendedFallback
      - richness
      - responseTruncated
      properties:
        complete:
          type: boolean
          description: Whether coverage met the target without truncation.
        reportedReplyCount:
          type: integer
          minimum: 0
          description: Reply count reported on the source post.
        targetDirectReplies:
          type: integer
          minimum: 0
          description: Minimum direct replies required for the coverage target.
        uniqueDirectReplies:
          type: integer
          minimum: 0
          description: Unique replies whose parent ID equals the source post ID.
        coveragePercentage:
          type: number
          minimum: 0
          maximum: 100
          description: Unique direct replies as a percentage of the reported count.
        nestedReplyCount:
          type: integer
          minimum: 0
          description: Unique nested replies kept outside direct coverage.
        pagesAttempted:
          type: integer
          minimum: 0
          description: Total pages attempted across all strategies.
        strategiesAttempted:
          type: array
          description: Per-strategy pagination and contribution evidence.
          items:
            $ref: '#/components/schemas/ReplyCoverageStrategy'
        duplicateCount:
          type: integer
          minimum: 0
          description: Duplicate tweet IDs removed across pages and strategies.
        cursorFailures:
          type: integer
          minimum: 0
          description: Cursor requests that failed.
        repeatedCursorCount:
          type: integer
          minimum: 0
          description: Repeated cursors rejected to prevent loops.
        emptyFalseProgressPages:
          type: integer
          minimum: 0
          description: Empty pages rejected because they did not make progress.
        malformedCount:
          type: integer
          minimum: 0
          description: Malformed response items rejected.
        unrelatedCount:
          type: integer
          minimum: 0
          description: Tweets rejected because they belonged elsewhere.
        missingResponseModulesOrFields:
          type: array
          description: Expected response modules or fields missing from X.
          items:
            type: string
        recommendedFallback:
          type: string
          description: Recommended next action when coverage is incomplete.
        richness:
          $ref: '#/components/schemas/ReplyCoverageRichness'
        responseTruncated:
          type: boolean
          description: Whether the requested row limit truncated safe results.
    AuthenticatedPaymentRequired:
      description: Authenticated credit or subscription error with confirmation-gated hosted checkout actions.
      type: object
      additionalProperties: false
      required:
      - balance
      - dashboard
      - error
      - message
      - next_step
      - payment_options
      - required
      - top_up_endpoint
      - top_up_url
      properties:
        balance:
          type: string
          pattern: ^\d+$
          description: Available credits as a decimal string.
        dashboard:
          type: string
          const: /dashboard/account
          description: Account page for manual billing management.
        error:
          type: string
          enum:
          - insufficient_credits
          - no_credits
          - no_subscription
          - subscription_inactive
        message:
          type: string
        next_step:
          type: string
          const: Ask the user to confirm a payment option before creating checkout.
        payment_options:
          type: object
          additionalProperties: false
          required:
          - credits
          - subscription
          properties:
            credits:
              type: object
              additionalProperties: false
              required:
              - create_checkout
              properties:
                create_checkout:
                  type: object
                  additionalProperties: false
                  required:
                  - body
                  - creates
                  - method
                  - path
                  - provider
                  - requires_authentication
                  - requires_user_confirmation
                  - response_url_field
                  properties:
                    body:
                      type: object
                      additionalProperties: false
                      required:
                      - dollars
                      - locale
                      properties:
                        dollars:
                          type: integer
                          const: 10
                        locale:
                          type: string
                          const: en
                    creates:
                      type: string
                      const: checkout_url
                    method:
                      type: string
                      const: POST
                    path:
                      type: string
                      const: /api/v1/credits/topup
                    provider:
                      type: string
                      deprecated: true
                      const: stripe
                    requires_authentication:
                      type: boolean
                      const: true
                    requires_user_confirmation:
                      type: boolean
                      const: true
                    response_url_field:
                      type: string
                      const: url
            subscription:
              type: object
              additionalProperties: false
              required:
              - create_checkout
              properties:
                create_checkout:
                  type: object
                  additionalProperties: false
                  required:
                  - body
                  - creates
                  - method
                  - path
                  - provider
                  - requires_authentication
                  - requires_user_confirmation
                  - response_url_field
                  properties:
                    body:
                      type: object
                      additionalProperties: false
                      required:
                      - tier
                      properties:
                        tier:
                          type: string
                          const: starter
                    creates:
                      type: string
                      const: checkout_url
                    method:
                      type: string
                      const: POST
                    path:
                      type: string
                      const: /api/v1/subscribe
                    provider:
                      type: string
                      deprecated: true
                      const: stripe
                    requires_authentication:
                      type: boolean
                      const: true
                    requires_user_confirmation:
                      type: boolean
                      const: true
                    response_url_field:
                      type: string
                      const: url
        required:
          type: string
          pattern: ^\d+$
          description: Credits required for the blocked request.
        top_up_endpoint:
          type: string
          const: /api/v1/credits/topup
        top_up_url:
          type: string
          const: POST /api/v1/credits/topup
