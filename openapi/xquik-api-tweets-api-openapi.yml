              coveragePercentage: 42
              nestedReplyCount: 5
              pagesAttempted: 12
              strategiesAttempted: []
              duplicateCount: 3
              cursorFailures: 0
              repeatedCursorCount: 0
              emptyFalseProgressPages: 1
              malformedCount: 0
              unrelatedCount: 2
              missingResponseModulesOrFields: []
              recommendedFallback: Retry complete mode later. X did not expose enough direct replies.
              richness:
                totalReplies: 42
                text: 42
                author: 40
                createdAt: 42
                language: 38
                url: 42
                entities: 20
                media: 5
                article: 0
                card: 2
                communityNote: 0
                quotedOrRepostedTweet: 1
                engagementCounts: 42
              responseTruncated: false
