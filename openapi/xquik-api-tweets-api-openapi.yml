openapi: 3.2.0
info:
  title: Xquik Tweets API
  version: '1.0'
  description: Xquik is an independent third-party service.
  x-guidance: '## Common tasks


    **Find a tweet** - GET /x/tweets/{id}. Returns text, author, metrics, media, and creation time. Cost: $0.00015 per lookup.


    **Search tweets** - GET /x/tweets/search?q={query}&limit={n}. Supports X operators, structured filters, Tweet IDs, and status URLs. Omit mode for automatic coverage. Cost: $0.00015 per returned tweet.


    **Find a user** - GET /x/users/{id}. Accepts an ID or username. Cost: $0.00015 per lookup.


    **Check if A follows B** - GET /x/followers/check?source={a}&target={b}. Accepts usernames or profile URLs. Cost: $0.00075.


    **Get trends** - GET /trends?woeid={region}&count={n}. WOEID 1 is worldwide. Cost: $0.00045.


    **Download media** - POST /x/media/download with `tweetIds`. Fresh Tweets cost 1 credit each. Cached repeats are free.


    **Read an article** - GET /x/articles/{tweetId}. Cost: $0.00075.


    ## Pagination


    Default platform pages return `hasMore` and `nextCursor`. X pages return `has_next_page` and `next_cursor`. The 2026-04-29 contract returns `has_more` and `next_cursor`. Pass cursors through `cursor`; `after` remains compatible. Dynamic pricing counts returned items, not requests.


    Omit `mode` for automatic reads. Pass cursors unchanged. `mode=standard` remains legacy. Retry 409 responses after `Retry-After`. Restart 410 responses without a cursor.


    ## Authentication


    Eligible reads accept guest wallets. Fixed-price lookups also accept MPP. Other features require an API key or OAuth 2.1 bearer token. API keys also support `Authorization: Bearer xq_...`.


    ## Best-Practice Response Contract


    v1 remains the default. Send `xquik-api-contract: 2026-04-29` for snake_case, Unix timestamps, structured errors, unified pagination, resource objects, and prefixed IDs. Dependency failures use 424 instead of 502.'
  contact:
    name: Xquik
    url: https://xquik.com
    email: support@xquik.com
servers:
- url: https://xquik.com
security:
- apiKey: []
- oauthBearer: []
tags:
- name: Tweets
  description: Look up, search, and analyze individual tweets
paths:
  /api/v1/x/tweets:
    get:
      operationId: getBatchTweets
      summary: Get multiple tweets by IDs
      tags:
      - Tweets
      security:
      - apiKey: []
      - oauthBearer: []
      - {}
      parameters:
      - name: ids
        in: query
        required: true
        schema:
          type: string
        description: Comma-separated tweet IDs (max 100)
      responses:
        '200':
          description: Requested tweets in request order. Partial successful reads recheck unresolved IDs once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTweets'
              example:
                tweets:
                - id: '1234567890'
                  text: Just launched our new feature!
                  createdAt: '2025-01-15T12:00:00Z'
                  likeCount: 42
                  retweetCount: 5
                  replyCount: 3
                  quoteCount: 1
                  viewCount: 1500
                  bookmarkCount: 2
                  author:
                    id: '9876543210'
                    username: elonmusk
                    name: Elon Musk
                    verified: true
                has_next_page: false
                next_cursor: ''
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/AnonymousGuestAuthenticationRequired'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '424':
          $ref: '#/components/responses/XApiError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/XApiError'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Get multiple tweets by IDs.
  /api/v1/x/tweets/search:
    get:
      operationId: searchTweets
      summary: Search tweets by query, Tweet ID, X status URL, or account date window
      description: No-mode search maximizes coverage. New cursorless `Latest` sessions return rows newest-first across cursor pages. Existing cursors preserve their established ordering.
      tags:
      - Tweets
      security:
      - apiKey: []
      - oauthBearer: []
      - {}
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Query, Tweet ID, or status URL. Valid inline bounds apply per page.
      - name: queryType
        in: query
        required: false
        schema:
          type: string
          enum:
          - Latest
          - Top
          default: Latest
        description: Sort order - Latest (chronological) or Top (engagement-ranked)
      - $ref: '#/components/parameters/AutomaticCoverageMode'
      - $ref: '#/components/parameters/AutomaticCoverageCursor'
      - name: sinceTime
        in: query
        schema:
          type: string
        description: Inclusive ISO bound.
      - name: untilTime
        in: query
        schema:
          type: string
        description: Exclusive ISO bound.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10000
        description: 'Result upper bound. Omit it for the existing 20-row page size. Explicit coverage defaults to 2000 and allows 10000. For paid requests, remaining credits can reduce results. Zero affordable results returns 402.

          '
      - $ref: '#/components/parameters/TweetFilterFromUser'
      - $ref: '#/components/parameters/TweetFilterToUser'
      - $ref: '#/components/parameters/TweetFilterMentioning'
      - $ref: '#/components/parameters/TweetFilterLanguage'
      - $ref: '#/components/parameters/TweetFilterSinceDate'
      - $ref: '#/components/parameters/TweetFilterUntilDate'
      - $ref: '#/components/parameters/TweetFilterMediaType'
      - $ref: '#/components/parameters/TweetFilterMinFaves'
      - $ref: '#/components/parameters/TweetFilterMinRetweets'
      - $ref: '#/components/parameters/TweetFilterMinReplies'
      - $ref: '#/components/parameters/TweetFilterMinQuotes'
      - $ref: '#/components/parameters/TweetFilterMinViews'
      - $ref: '#/components/parameters/TweetFilterMinBookmarks'
      - $ref: '#/components/parameters/TweetFilterMaxFaves'
      - $ref: '#/components/parameters/TweetFilterMaxRetweets'
      - $ref: '#/components/parameters/TweetFilterMaxReplies'
      - $ref: '#/components/parameters/TweetFilterMaxQuotes'
      - $ref: '#/components/parameters/TweetFilterBlueVerifiedOnly'
      - $ref: '#/components/parameters/TweetFilterCardName'
      - $ref: '#/components/parameters/TweetFilterSource'
      - $ref: '#/components/parameters/TweetFilterExcludeSource'
      - $ref: '#/components/parameters/TweetFilterGeocode'
      - $ref: '#/components/parameters/TweetFilterSinceId'
      - $ref: '#/components/parameters/TweetFilterMaxId'
      - $ref: '#/components/parameters/TweetFilterNear'
      - $ref: '#/components/parameters/TweetFilterWithin'
      - $ref: '#/components/parameters/TweetFilterWithinTime'
      - $ref: '#/components/parameters/TweetFilterNativeRetweets'
      - $ref: '#/components/parameters/TweetFilterSafe'
      - $ref: '#/components/parameters/TweetFilterNews'
      - $ref: '#/components/parameters/TweetFilterVerifiedOnly'
      - $ref: '#/components/parameters/TweetFilterReplies'
      - $ref: '#/components/parameters/TweetFilterRetweets'
      - $ref: '#/components/parameters/TweetFilterQuotes'
      - $ref: '#/components/parameters/TweetFilterExactPhrase'
      - $ref: '#/components/parameters/TweetFilterExcludeWords'
      - $ref: '#/components/parameters/TweetFilterAnyWords'
      - $ref: '#/components/parameters/TweetFilterHashtags'
      - $ref: '#/components/parameters/TweetFilterCashtags'
      - $ref: '#/components/parameters/TweetFilterUrl'
      - $ref: '#/components/parameters/TweetFilterConversationId'
      - $ref: '#/components/parameters/TweetFilterInReplyToTweetId'
      - $ref: '#/components/parameters/TweetFilterQuotesOfTweetId'
      - $ref: '#/components/parameters/TweetFilterRetweetsOfTweetId'
      - $ref: '#/components/parameters/TweetSearchListId'
      - $ref: '#/components/parameters/TweetSearchPlace'
      - $ref: '#/components/parameters/TweetSearchPlaceCountry'
      - $ref: '#/components/parameters/TweetSearchPointRadius'
      - $ref: '#/components/parameters/TweetSearchBoundingBox'
      - $ref: '#/components/parameters/TweetSearchAdvancedQuery'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PaginatedTweets'
                - $ref: '#/components/schemas/TweetSearchCoverageResponse'
              example:
                tweets:
                - id: '1234567890'
                  text: Just launched our new feature!
                  createdAt: '2025-01-15T12:00:00Z'
                  likeCount: 42
                  retweetCount: 5
                  replyCount: 3
                  quoteCount: 1
                  viewCount: 1500
                  bookmarkCount: 2
                  author:
                    id: '9876543210'
                    username: elonmusk
                    name: Elon Musk
                    verified: true
                has_next_page: true
                next_cursor: DAACCgACGRElMJcAAA
        '400':
          description: Missing query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: missing_query
        '401':
          $ref: '#/components/responses/AnonymousGuestAuthenticationRequired'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/CoverageCursorUnavailable'
        '410':
          $ref: '#/components/responses/CursorGone'
        '424':
          $ref: '#/components/responses/XApiError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/XApiError'
        '503':
          $ref: '#/components/responses/MaximumCoverageBusy'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/x/tweets/{id}:
    get:
      operationId: lookupTweet
      summary: Get tweet with full text, author, metrics and media
      tags:
      - Tweets
      security:
      - apiKey: []
      - oauthBearer: []
      - {}
      x-payment-info:
        offers:
        - amount: '150'
          currency: '0x20c000000000000000000000b9537d11c60e8b50'
          intent: charge
          method: tempo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Numeric tweet ID, 15-20 digits
      responses:
        '200':
          description: Tweet with author
          content:
            application/json:
              schema:
                type: object
                required:
                - tweet
                properties:
                  tweet:
                    $ref: '#/components/schemas/TweetDetail'
                  author:
                    $ref: '#/components/schemas/TweetAuthor'
                    example:
                      id: '9876543210'
                      username: elonmusk
                      name: Elon Musk
                      followers: 150000000
                      verified: true
              example:
                tweet:
                  id: '1234567890'
                  text: Just launched our new feature!
                  createdAt: '2025-01-15T12:00:00Z'
                  retweetCount: 5
                  replyCount: 3
                  likeCount: 42
                  quoteCount: 1
                  viewCount: 1500
                  bookmarkCount: 2
                author:
                  id: '9876543210'
                  username: elonmusk
                  name: Elon Musk
                  followers: 150000000
                  verified: true
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          description: Tweet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: tweet_not_found
                message: Tweet not found. Check the tweet ID.
        '424':
          $ref: '#/components/responses/XApiError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/XApiError'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Get tweet with full text, author, metrics and media.
  /api/v1/x/tweets/{id}/favoriters:
    get:
      operationId: getTweetFavoriters
      summary: List visible users who liked a tweet
      description: Returns liker profiles that X makes visible for the post. X can withhold liker identities even when the post reports likes. In that case this endpoint returns 424 `favoriters_unavailable` instead of a misleading empty success.
      tags:
      - Tweets
      security:
      - apiKey: []
      - oauthBearer: []
      - {}
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Tweet ID to get favoriters
      - name: cursor
        in: query
        schema:
          type: string
        description: Pagination cursor for favoriters
      - $ref: '#/components/parameters/FollowerPageSize'
      - $ref: '#/components/parameters/UserFilterMinFollowers'
      - $ref: '#/components/parameters/UserFilterMaxFollowers'
      - $ref: '#/components/parameters/UserFilterMinFollowing'
      - $ref: '#/components/parameters/UserFilterMaxFollowing'
      - $ref: '#/components/parameters/UserFilterMinStatuses'
      - $ref: '#/components/parameters/UserFilterMaxStatuses'
      - $ref: '#/components/parameters/UserFilterMinAccountAgeDays'
      - $ref: '#/components/parameters/UserFilterVerifiedOnly'
      - $ref: '#/components/parameters/UserFilterVerifiedType'
      - $ref: '#/components/parameters/UserFilterHasWebsite'
      - $ref: '#/components/parameters/UserFilterHasLocation'
      - $ref: '#/components/parameters/UserFilterBioContains'
      - $ref: '#/components/parameters/UserFilterLocationContains'
      - $ref: '#/components/parameters/UserFilterUsernameContains'
      responses:
        '200':
          description: Visible users who liked the tweet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/AnonymousGuestAuthenticationRequired'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '424':
          $ref: '#/components/responses/FavoritersUnavailable'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/XApiError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/x/bookmarks:
    get:
      operationId: getBookmarks
      summary: Get bookmarked tweets
      tags:
      - Tweets
      security:
      - apiKey: []
      - oauthBearer: []
      parameters:
      - name: folderId
        in: query
        schema:
          type: string
        description: Optional bookmark folder ID
      - name: cursor
        in: query
        schema:
          type: string
          example: DAACCgACGRElMJcAAA
        description: Pagination cursor for bookmarks
      responses:
        '200':
          description: List of bookmarked tweets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTweets'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '424':
          $ref: '#/components/responses/XApiError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/XApiError'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Get bookmarked tweets.
  /api/v1/x/bookmarks/folders:
    get:
      operationId: getBookmarkFolders
      summary: Get bookmark folders
      tags:
      - Tweets
      security:
      - apiKey: []
      - oauthBearer: []
      responses:
        '200':
          description: List of bookmark folders
          content:
            application/json:
              schema:
                type: object
                required:
                - folders
                - has_next_page
                - next_cursor
                properties:
                  folders:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      properties:
                        id:
                          type: string
                          example: '1234567890'
                        name:
                          type: string
                          example: Read Later
                    example:
                    - id: '1234567890'
                      name: Read Later
                  has_next_page:
                    type: boolean
                    description: Always false for the current bookmark folder route
                    example: false
                  next_cursor:
                    type: string
                    description: Always empty for the current bookmark folder route
                    example: ''
              example:
                folders:
                - id: '1234567890'
                  name: Read Later
                has_next_page: false
                next_cursor: ''
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '424':
          $ref: '#/components/responses/XApiError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/XApiError'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Get bookmark folders.
  /api/v1/x/timeline:
    get:
      operationId: getTimeline
      summary: Get home timeline
      tags:
      - Tweets
      security:
      - apiKey: []
      - oauthBearer: []
      parameters:
      - name: seenTweetIds
        in: query
        schema:
          type: string
        description: Comma-separated tweet IDs to exclude from results. Empty entries are ignored.
      - name: cursor
        in: query
        schema:
          type: string
        description: Pagination cursor for timeline
      responses:
        '200':
          description: List of timeline tweets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTweets'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '424':
          $ref: '#/components/responses/XApiError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/XApiError'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Get home timeline.
  /api/v1/x/tweets/{id}/quotes:
    get:
      operationId: getTweetQuotes
      summary: List quote tweets of a tweet
      tags:
      - Tweets
      security:
      - apiKey: []
      - oauthBearer: []
      - {}
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Numeric tweet ID to get quotes, 15-20 digits
      - $ref: '#/components/parameters/AutomaticCoverageCursor'
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - standard
        description: Optional legacy pagination override.
      - $ref: '#/components/parameters/AutomaticTweetPageSize'
      - name: sinceTime
        in: query
        schema:
          type: string
        description: Unix timestamp - return quotes posted after this time
      - name: untilTime
        in: query
        schema:
          type: string
        description: Unix timestamp - return quotes posted before this time
      - name: includeReplies
        in: query
        schema:
          type: boolean
        description: Include reply quotes (default false)
      - $ref: '#/components/parameters/TweetFilterFromUser'
      - $ref: '#/components/parameters/TweetFilterToUser'
      - $ref: '#/components/parameters/TweetFilterMentioning'
      - $ref: '#/components/parameters/TweetFilterLanguage'
      - $ref: '#/components/parameters/TweetFilterSinceDate'
      - $ref: '#/components/parameters/TweetFilterUntilDate'
      - $ref: '#/components/parameters/TweetFilterMediaType'
      - $ref: '#/components/parameters/TweetFilterMinFaves'
      - $ref: '#/components/parameters/TweetFilterMinRetweets'
      - $ref: '#/components/parameters/TweetFilterMinReplies'
      - $ref: '#/components/parameters/TweetFilterMinQuotes'
      - $ref: '#/components/parameters/TweetFilterMinViews'
      - $ref: '#/components/parameters/TweetFilterMinBookmarks'
      - $ref: '#/components/parameters/TweetFilterMaxFaves'
      - $ref: '#/components/parameters/TweetFilterMaxRetweets'
      - $ref: '#/components/parameters/TweetFilterMaxReplies'
      - $ref: '#/components/parameters/TweetFilterMaxQuotes'
      - $ref: '#/components/parameters/TweetFilterBlueVerifiedOnly'
      - $ref: '#/components/parameters/TweetFilterCardName'
      - $ref: '#/components/parameters/TweetFilterSource'
      - $ref: '#/components/parameters/TweetFilterExcludeSource'
      - $ref: '#/components/parameters/TweetFilterGeocode'
      - $ref: '#/components/parameters/TweetFilterSinceId'
      - $ref: '#/components/parameters/TweetFilterMaxId'
      - $ref: '#/components/parameters/TweetFilterNear'
      - $ref: '#/components/parameters/TweetFilterWithin'
      - $ref: '#/components/parameters/TweetFilterWithinTime'
      - $ref: '#/components/parameters/TweetFilterNativeRetweets'
      - $ref: '#/components/parameters/TweetFilterSafe'
      - $ref: '#/components/parameters/TweetFilterNews'
      - $ref: '#/components/parameters/TweetFilterVerifiedOnly'
      - $ref: '#/components/parameters/TweetFilterReplies'
      - $ref: '#/components/parameters/TweetFilterRetweets'
      - $ref: '#/components/parameters/TweetFilterQuotes'
      - $ref: '#/components/parameters/TweetFilterExactPhrase'
      - $ref: '#/components/parameters/TweetFilterExcludeWords'
      - $ref: '#/components/parameters/TweetFilterAnyWords'
      - $ref: '#/components/parameters/TweetFilterHashtags'
      - $ref: '#/components/parameters/TweetFilterCashtags'
      - $ref: '#/components/parameters/TweetFilterUrl'
      - $ref: '#/components/parameters/TweetFilterConversationId'
      - $ref: '#/components/parameters/TweetFilterInReplyToTweetId'
      - $ref: '#/components/parameters/TweetFilterQuotesOfTweetId'
      - $ref: '#/components/parameters/TweetFilterRetweetsOfTweetId'
      responses:
        '200':
          description: List of quote tweets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTweets'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/AnonymousGuestAuthenticationRequired'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '424':
          $ref: '#/components/responses/XApiError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/XApiError'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: List quote tweets of a tweet.
  /api/v1/x/tweets/{id}/replies:
    get:
      operationId: getTweetReplies
      summary: List replies to a tweet
      description: Returns direct replies. Omit mode for automatic maximum coverage with resumable pagination. Complete mode returns nested replies, diagnostics, and 424 when direct coverage stays below 80%.
      tags:
      - Tweets
      security:
      - apiKey: []
      - oauthBearer: []
      - {}
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Tweet ID to get replies
      - $ref: '#/components/parameters/AutomaticCoverageCursor'
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - standard
          - complete
        description: 'Optional advanced override. Omit mode for automatic maximum direct reply coverage with pagination. Standard keeps legacy pagination. Complete returns direct and nested replies with diagnostics, scope, depth, sorting, and original-post controls.

          '
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 25000
        description: 'With mode=complete, maximum combined direct and nested reply rows (1-25000, default 25000). Automatic pages accept 1-300. Standard pages accept 1-100. Prefer pageSize outside complete mode.

          '
      - $ref: '#/components/parameters/AutomaticTweetPageSize'
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - all
          - direct
          - nested
          default: all
        description: Select all replies, direct replies, or nested replies.
      - name: maxDepth
        in: query
        schema:
          type: integer
          minimum: 1
        description: Maximum reply depth from the source post.
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - relevance
          - latest
          - oldest
          - likes
          default: relevance
        description: Sort the selected replies before applying limit.
      - name: excludeOriginalAuthor
        in: query
        schema:
          type: boolean
          default: false
        description: Exclude replies written by the source-post author.
      - name: includeOriginalPost
        in: query
        schema:
          type: boolean
          default: false
        description: Include the source post and count it toward limit.
      - name: hasMediaOnly
        in: query
        schema:
          type: boolean
          default: false
        description: Only return replies containing media.
      - name: sinceTime
        in: query
        schema:
          type: string
        description: Unix timestamp - return replies posted after this time
      - name: untilTime
        in: query
        schema:
          type: string
        description: Unix timestamp - return replies posted before this time
      - $ref: '#/components/parameters/TweetFilterFromUser'
      - $ref: '#/components/parameters/TweetFilterToUser'
