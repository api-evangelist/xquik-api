        description:
          type: string
        url:
          type: string
        urlType:
          type: string
        userLabelDisplayType:
          type: string
        userLabelType:
          type: string
    TweetPreviousCounts:
      description: Engagement counts retained from a prior tweet edit.
      type: object
      properties:
        bookmarkCount:
          type: integer
        likeCount:
          type: integer
        quoteCount:
          type: integer
        replyCount:
          type: integer
        retweetCount:
          type: integer
    XWriteActionResult:
      type:
      - object
      - 'null'
      description: Confirmed result produced by the write, when available.
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - tweet
          - direct_message
          - media
          - community
          - state_change
        id:
          type: string
        state:
          type: string
      example:
        type: state_change
