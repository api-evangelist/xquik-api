components:
  parameters:
    TweetFilterExactPhrase:
      name: exactPhrase
      in: query
      schema:
        type: string
      description: Exact phrase to match.
    UserFilterMinStatuses:
      name: minStatuses
      in: query
      schema:
        type: integer
        minimum: 0
      description: Minimum post count. minPosts is also accepted.
    TweetFilterSource:
      name: source
      in: query
      schema:
        type: string
      description: Match the source application.
    UserFilterUsernameContains:
      name: usernameContains
      in: query
      schema:
        type: string
      description: Match a username substring, ignoring case.
    TweetFilterWithin:
      name: within
      in: query
      schema:
        type: string
      description: Set the radius for the near filter.
    TweetFilterMaxReplies:
      name: maxReplies
      in: query
      schema:
        type: integer
        minimum: 0
      description: Maximum replies threshold.
    TweetFilterMinFaves:
      name: minFaves
      in: query
      schema:
        type: integer
        minimum: 0
      description: Minimum likes threshold. minLikes is also accepted.
    TweetFilterToUser:
      name: toUser
      in: query
      schema:
        type: string
      description: Filter replies sent to a username.
    AutomaticCoverageMode:
      name: mode
      in: query
      schema:
        type: string
        enum:
        - standard
        - coverage
      description: 'Omit mode for resumable maximum coverage. Standard keeps legacy pagination. Coverage returns diagnostics once and rejects cursors.

        '
    TweetSearchPlace:
      name: place
      in: query
      schema:
        type: string
      description: Search within a place ID.
    TweetFilterMaxQuotes:
      name: maxQuotes
      in: query
      schema:
        type: integer
        minimum: 0
      description: Maximum quotes threshold.
    UserFilterHasLocation:
      name: hasLocation
      in: query
      schema:
        type: boolean
      description: Only return profiles with a location.
    TweetFilterUrl:
      name: url
      in: query
      schema:
        type: string
      description: URL substring or domain filter.
    TweetFilterMinReplies:
      name: minReplies
      in: query
      schema:
        type: integer
        minimum: 0
      description: Minimum replies threshold.
    UserFilterMaxFollowers:
      name: maxFollowers
      in: query
      schema:
        type: integer
        minimum: 0
      description: Maximum follower count. Missing counts pass this maximum.
    TweetFilterNews:
      name: news
      in: query
      schema:
        type: boolean
      description: Only return news results.
    TweetFilterExcludeWords:
      name: excludeWords
      in: query
      schema:
        type: string
      description: Words or quoted phrases to exclude. Separate with spaces, commas, or lines.
    TweetFilterHashtags:
      name: hashtags
      in: query
      schema:
        type: string
      description: Hashtags separated by spaces, commas, or lines.
    TweetFilterRetweets:
      name: retweets
      in: query
      schema:
        type: string
        enum:
        - include
        - exclude
        - only
      description: Retweet mode.
    TweetFilterMinRetweets:
      name: minRetweets
      in: query
      schema:
        type: integer
        minimum: 0
      description: Minimum retweets threshold.
    TweetFilterBlueVerifiedOnly:
      name: blueVerifiedOnly
      in: query
      schema:
        type: boolean
      description: Only return tweets from Blue-verified authors.
    UserFilterMinAccountAgeDays:
      name: minAccountAgeDays
      in: query
      schema:
        type: integer
        minimum: 0
      description: Minimum account age in whole days.
    TweetFilterQuotesOfTweetId:
      name: quotesOfTweetId
      in: query
      schema:
        type: string
      description: Only quotes of this tweet ID.
    TweetSearchBoundingBox:
      name: boundingBox
      in: query
      schema:
        type: string
      description: Geo bounding box, e.g. -74.1 40.6 -73.9 40.8.
    AutomaticTweetPageSize:
      name: pageSize
      in: query
      description: 'Automatic pages accept 1-300 Tweets. Standard pages keep 1-100. Default 20. Continue while has_next_page is true. Deprecated aliases remain accepted.

        '
      schema:
        type: integer
        minimum: 1
        maximum: 300
        default: 20
    TweetFilterSinceId:
      name: sinceId
      in: query
      schema:
        type: string
      description: Return Tweets newer than this Tweet ID.
    TweetFilterRetweetsOfTweetId:
      name: retweetsOfTweetId
      in: query
      schema:
        type: string
      description: Only retweets of this tweet ID.
    TweetFilterConversationId:
      name: conversationId
      in: query
