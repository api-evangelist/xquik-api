        afterMs:
          type: integer
          minimum: 0
        requiresNewIdempotencyKey:
          type: boolean
    TweetEdit:
      description: Edit history metadata returned by X.
      type: object
      properties:
        editTweetIds:
          type: array
          items:
            type: string
        editableUntilMsecs:
          type: string
    GuestPaymentRequired:
      description: 'Credit error for a paid-read guest key with only its accountless guest top-up action.

        '
      type: object
      additionalProperties: false
      required:
      - balance
      - error
      - message
      - next_step
      - payment_options
      - required
      - top_up_endpoint
      - top_up_url
      properties:
        balance:
          type: string
          pattern: ^\d+$
        error:
          type: string
          enum:
          - insufficient_credits
          - no_credits
          - no_subscription
          - subscription_inactive
        message:
          type: string
        next_step:
          type: string
          const: Ask the user to confirm a USD amount before creating checkout.
        payment_options:
          type: object
          additionalProperties: false
          required:
          - credits
          properties:
            credits:
              type: object
              additionalProperties: false
              required:
              - create_checkout
              properties:
                create_checkout:
                  $ref: '#/components/schemas/GuestWalletTopupCheckoutAction'
        required:
          type: string
          pattern: ^\d+$
        top_up_endpoint:
          type: string
          const: /api/v1/guest-wallets/topups
        top_up_url:
          type: string
          const: POST /api/v1/guest-wallets/topups
    TweetDetail:
      description: Full tweet with text, engagement metrics, media, and metadata. A zero metric can mean X did not report the count.
      type: object
      required:
      - id
      - text
      - retweetCount
      - replyCount
      - likeCount
      - quoteCount
      - viewCount
      - bookmarkCount
      properties:
        id:
          type: string
        text:
          type: string
        createdAt:
          type: string
        isNoteTweet:
          type: boolean
          description: Whether this is a Note Tweet (long-form post, up to 25,000 characters)
        isReply:
          type: boolean
          description: Whether this tweet is a reply to another tweet
        isLimitedReply:
          type: boolean
          description: Whether replies are limited for this tweet
        isQuoteStatus:
          type: boolean
          description: Whether this tweet quotes another tweet
        conversationId:
          type: string
          description: ID of the root tweet in the conversation thread
        source:
          type: string
          description: Client application used to post this tweet
        type:
          type: string
          description: Tweet result type
        url:
          type: string
          description: Tweet permalink URL
        lang:
          type: string
          description: Tweet language code
        inReplyToId:
          type: string
          description: Tweet ID being replied to
        inReplyToUserId:
          type: string
          description: User ID being replied to
        inReplyToUsername:
          type: string
          description: Username being replied to
        displayTextRange:
          type: array
          items:
            type: integer
          description: Start and end offsets for rendered tweet text
        contentDisclosure:
          $ref: '#/components/schemas/ContentDisclosure'
        article:
          $ref: '#/components/schemas/TweetArticleMetadata'
        card:
          $ref: '#/components/schemas/TweetCard'
        communityNote:
          $ref: '#/components/schemas/TweetCommunityNote'
        edit:
          $ref: '#/components/schemas/TweetEdit'
        isTranslatable:
          type: boolean
        noteTweet:
          $ref: '#/components/schemas/TweetNote'
        place:
          $ref: '#/components/schemas/TweetPlace'
        possiblySensitive:
          type: boolean
        previousCounts:
          $ref: '#/components/schemas/TweetPreviousCounts'
        viewState:
          type: string
        entities:
          type: object
          additionalProperties: true
          x-stainless-any: true
          x-stainless-terraform-type: string
          description: Parsed entities from the tweet text (URLs, mentions, hashtags, media)
        quoted_tweet:
          $ref: '#/components/schemas/EmbeddedTweet'
        retweeted_tweet:
          $ref: '#/components/schemas/EmbeddedTweet'
        author:
          $ref: '#/components/schemas/TweetAuthor'
        media:
          type: array
          items:
            $ref: '#/components/schemas/TweetMedia'
          description: Attached media items, omitted when the tweet has no media
        retweetCount:
          type: integer
        replyCount:
          type: integer
        likeCount:
          type: integer
        quoteCount:
          type: integer
        viewCount:
          type: integer
        bookmarkCount:
          type: integer
    XWriteActionBilling:
      type: object
      additionalProperties: false
      required:
      - status
      - charged
      - plannedCredits
      - chargedCredits
      properties:
        status:
          type: string
          enum:
          - not_charged
          - pending
          - charged
          - charge_failed
          - refunded
        charged:
          type: boolean
        plannedCredits:
          type: string
          pattern: ^\d+$
        chargedCredits:
          type: string
          pattern: ^\d+$
      description: 'plannedCredits is the approved maximum. chargedCredits comes from the settled credit ledger. Pending or failed writes are not charged.

        '
    GuestWalletPurchaseRequest:
      description: User-confirmed guest wallet checkout request.
      type: object
      additionalProperties: false
      required:
      - amount_minor
      - currency
      properties:
        amount_minor:
          type: integer
          minimum: 1000
          maximum: 25000
          description: USD cents accepted for this checkout.
        currency:
          type: string
          const: usd
    ReplyCoverageStrategy:
      type: object
      required:
      - name
      - pagesAttempted
      - newDirectReplies
      - newNestedReplies
      - stopReason
      properties:
        name:
          type: string
        pagesAttempted:
          type: integer
          minimum: 0
        newDirectReplies:
          type: integer
          minimum: 0
        newNestedReplies:
          type: integer
          minimum: 0
        stopReason:
          type: string
          enum:
          - deadline
          - empty_pages
          - error
          - missing_cursor
          - no_next_page
          - page_cap
          - repeated_cursor
    TweetCard:
      description: Public card metadata attached to a tweet.
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        bindingValues:
          type: object
          additionalProperties: true
          x-stainless-any: true
          x-stainless-terraform-type: string
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: 'Xquik API key passed through the x-api-key header. Xquik-Api-Key is a vendor-prefixed alias. API keys beginning with xq_ can also use Authorization: Bearer.'
    oauthBearer:
      type: http
      scheme: bearer
      description: 'OAuth 2.1 access token passed through Authorization: Bearer. Values beginning with xq_ remain Xquik API-key credentials, not OAuth tokens.'
    cookieSession:
      type: apiKey
      in: cookie
      name: __Host-xquik_session
      description: Secure Xquik browser session cookie.
x-service-info:
  categories:
  - data
  docs:
    homepage: https://xquik.com
    apiReference: https://docs.xquik.com
    llms: https://docs.xquik.com/llms.txt
x-discovery:
  ownershipProofs:
  - dns:xquik.com
