        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        nextBillingAt:
          type: string
          format: date-time
          description: Next hourly credit charge time for this keyword query monitor.
    Monitor:
      description: Account monitor that tracks activity for a given X user.
      type: object
      required:
      - id
      - username
      - xUserId
      - eventTypes
      - isActive
      - createdAt
