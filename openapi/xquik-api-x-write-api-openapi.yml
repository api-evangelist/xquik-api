  /api/v1/x/dm/{userId}:
    post:
      operationId: sendDm
      x-write-action: send_dm
      summary: Send direct message
      tags:
      - X Write
      security:
      - apiKey: []
      - oauthBearer: []
      parameters:
      - $ref: '#/components/parameters/WriteIdempotencyKey'
      - name: userId
        in: path
        required: true
        schema:
          type: string
        description: Recipient user ID
      requestBody:
        required: true
        description: Account, message text, and an optional media attachment.
        content:
          application/json:
            schema:
              type: object
              required:
              - account
              - text
              properties:
                account:
                  type: string
                  description: X account (@username or ID) sending the DM
                  example: '@elonmusk'
                text:
                  type: string
                  example: Example text
                media_ids:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Optional array containing exactly 1 uploaded media ID.
                  example:
                  - '1234567890123456789'
            example:
              account: '@elonmusk'
              text: Example text content
              media_ids:
              - '1234567890123456789'
      responses:
        '200':
          $ref: '#/components/responses/WriteActionCompleted'
        '202':
          $ref: '#/components/responses/WriteActionAccepted'
        '400':
          $ref: '#/components/responses/WriteInvalidInput'
