components:
  responses:
    PaymentRequired:
      description: 'Payment required. MPP reads return a problem document and `WWW-Authenticate`. Authenticated reads return balances and checkout actions. Guest keys receive only the guest top-up action. Other endpoints may use legacy errors. A failed request never creates checkout. Require user confirmation before creating one.

        '
      headers:
        WWW-Authenticate:
          description: MPP payment challenge for eligible anonymous pay-per-use requests. Authenticated credit or subscription errors omit this header.
          schema:
            type: string
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/XWritePaymentRequired'
            - $ref: '#/components/schemas/AuthenticatedPaymentRequired'
            - $ref: '#/components/schemas/GuestPaymentRequired'
            - allOf:
              - $ref: '#/components/schemas/Error'
              - not:
                  required:
                  - payment_options
          example:
            balance: '0'
            dashboard: /dashboard/account
            error: insufficient_credits
            message: Insufficient credits. Top up or subscribe to continue.
            next_step: Ask the user to confirm a payment option before creating checkout.
            payment_options:
              credits:
                create_checkout:
                  body:
                    dollars: 10
                    locale: en
                  creates: checkout_url
                  method: POST
                  path: /api/v1/credits/topup
                  provider: stripe
                  requires_authentication: true
                  requires_user_confirmation: true
                  response_url_field: url
              subscription:
                create_checkout:
                  body:
                    tier: starter
                  creates: checkout_url
                  method: POST
                  path: /api/v1/subscribe
                  provider: stripe
                  requires_authentication: true
                  requires_user_confirmation: true
                  response_url_field: url
            required: '1'
            top_up_endpoint: /api/v1/credits/topup
            top_up_url: POST /api/v1/credits/topup
        application/problem+json:
          schema:
            $ref: '#/components/schemas/MppPaymentRequired'
          example:
            account_required: false
            challengeId: Opaque MPP challenge identifier
            detail: Payment is required.
            hint: Use a supported wallet with an offer from the WWW-Authenticate header.
            status: 402
            title: Payment Required
            type: https://paymentauth.org/problems/payment-required
            next_step: Ask the user to confirm a USD amount before creating checkout.
            payment_options:
              guest_wallet:
                create_checkout:
                  account_required: false
                  amount_bounds:
                    currency: usd
                    maximum_minor: 25000
                    minimum_minor: 1000
                  body:
                    amount_minor: 1000
                    currency: usd
                  creates: checkout_url
                  method: POST
                  path: /api/v1/guest-wallets
                  provider: stripe
                  required_headers:
                    Idempotency-Key: <cryptographically random UUID v4>
                  requires_authentication: false
                  requires_user_confirmation: true
                  requires_user_interaction: true
                  response_fields:
                  - checkout_url
                  - api_key
                  - status_url
                  response_url_field: checkout_url
    AccountAuthError:
      description: 'The connected X account needs reauthentication or is currently restricted (locked, suspended, or recovering). Returns an error code of `account_needs_reauth` or `account_restricted`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: account_needs_reauth
            message: X account needs re-authentication. Re-add the account.
    RateLimitedByX:
      description: 'X throttled the write. Possible codes: `x_rate_limited` (short-term throttle) or `x_daily_limit` (daily cap hit). Back off and retry later. Distinct from Xquik tier-based 429.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: x_rate_limited
            message: Rate limited by X. Wait before retrying.
      headers:
        Retry-After:
          description: Seconds until the next permitted request.
          schema:
            example: 60
            minimum: 1
            type: integer
    XAccountNotFound:
      description: Connected X account not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: account_not_found
            message: X account not found. Connect it first at /dashboard/account?tab=x-accounts.
    WriteRejected:
      description: 'X rejected the write or media download. Codes include `x_content_too_long`, `x_duplicate_action`, `x_account_suspended`, `x_account_protected`, `x_dm_not_allowed`, `x_target_not_found`, `x_account_feature_required`, `x_rejected`, and `media_download_failed`. The media code covers URL, size, origin, and timeout failures.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: x_rejected
            message: X rejected this request. Wait a few minutes and try again.
    WriteActionCompleted:
      description: Write reached a terminal state.
      headers:
        X-Request-Id:
          required: true
          description: Correlation ID for support and observability.
          schema:
            type: string
        Location:
          description: Relative URL for the durable action record.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/XWriteAction'
          example:
            object: x_write_action
            id: '12345'
            writeActionId: '12345'
            action: like
            status: success
            terminal: true
            retryable: false
            safeToRetry: false
            statusUrl: /api/v1/x/write-actions/12345
            pollAfterMs: null
            charged: true
            chargedCredits: '10'
            billing:
              status: charged
              charged: true
              plannedCredits: '10'
              chargedCredits: '10'
            request:
              hash: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
              payload:
                tweet_id: '9876543210'
            account:
              id: '42'
              username: example
            target:
              type: tweet
              id: '9876543210'
            targetId: '9876543210'
            result:
              type: state_change
              id: '9876543210'
              state: liked
            nextAction: null
            sendDispatched: true
            success: true
    WriteError:
      description: 'Write operation failed. Possible error codes include x_write_failed, x_write_ambiguous, x_duplicate_action, and x_daily_limit. Inspect the durable action, safeToRetry, and nextAction fields before retrying.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: x_write_failed
            message: Write action failed unexpectedly. Contact support if this persists.
    WriteActionAccepted:
      description: 'Write was accepted or dispatched. Poll Location after Retry-After. Never submit another write while this action remains nonterminal.

        '
      headers:
        X-Request-Id:
          required: true
          description: Correlation ID for this accepted write response.
          schema:
            type: string
        Location:
          required: true
          description: Relative URL for polling the durable action record.
          schema:
            type: string
        Retry-After:
          required: true
          description: Recommended polling delay in seconds.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/XWriteAction'
          example:
            object: x_write_action
            id: '12346'
            writeActionId: '12346'
            action: create_tweet
            status: dispatching
            terminal: false
            retryable: false
            safeToRetry: false
            statusUrl: /api/v1/x/write-actions/12346
            pollAfterMs: 2000
            charged: false
            chargedCredits: '0'
            billing:
              status: pending
              charged: false
              plannedCredits: '30'
              chargedCredits: '0'
            request:
              hash: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
              payload:
                text: Hello from Xquik
            account:
              id: '42'
              username: example
            target: null
            targetId: null
            result: null
            nextAction:
              type: poll
              url: /api/v1/x/write-actions/12346
              afterMs: 2000
            sendDispatched: true
            success: false
    WriteInvalidInput:
      description: The write request is invalid and no action was dispatched.
      headers:
        X-Request-Id:
          required: true
          description: Correlation ID for this invalid write request.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/XWriteActionError'
          example:
            error: invalid_input
            message: Invalid input. Check request fields.
            charged: false
            chargedCredits: '0'
            retryable: false
            safeToRetry: true
            success: false
            nextAction:
              type: fix_request
    WriteTrackingUnavailable:
      description: 'Durable tracking or the write service is temporarily unavailable. Inspect safeToRetry before creating another action.

        '
      headers:
        X-Request-Id:
          required: true
          description: Correlation ID for this tracking failure.
          schema:
            type: string
        Retry-After:
          description: Recommended retry delay in seconds.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/XWriteActionError'
            - $ref: '#/components/schemas/XWriteAction'
          example:
            error: write_tracking_unavailable
            message: Write tracking unavailable. Try again.
            charged: false
            chargedCredits: '0'
            retryable: true
            safeToRetry: true
            success: false
            nextAction:
              type: retry
    WriteRateLimited:
      description: 'A write was throttled by Xquik''s tier or action limits (`rate_limit_exceeded`) or by X (`x_rate_limited`, `x_daily_limit`). Respect the `Retry-After` header when present, otherwise back off before retrying.

        '
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                retryAfter:
                  type: integer
                  example: 60
          examples:
            xquikLimit:
              summary: Xquik tier or action limit
              value:
                error: rate_limit_exceeded
                message: Too many requests. Try again later.
                retryAfter: 60
            xLimit:
              summary: X rate limit
              value:
                error: x_rate_limited
                message: Rate limited by X. Wait before retrying.
          example:
            error: rate_limit_exceeded
            message: Too many requests. Try again later.
            retryAfter: 60
      headers:
        Retry-After:
          description: Seconds until the next permitted request.
          schema:
            example: 60
            minimum: 1
            type: integer
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: Resource not found.
    Unauthenticated:
      description: Unauthenticated
      headers:
        Cache-Control:
          description: Prevents storage of authentication responses.
          schema:
            type: string
            const: no-store
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
            const: Bearer realm="xquik"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthenticated
            message: Authentication required. Provide a valid API key or bearer token.
    RateLimitExceeded:
      description: 'Xquik tier rate limit exceeded. The response includes a `Retry-After` header with the number of seconds to wait before retrying.

        '
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                retryAfter:
                  type: integer
                  example: 60
          example:
            error: rate_limit_exceeded
            message: Too many requests. Try again later.
            retryAfter: 60
      headers:
        Retry-After:
          description: Seconds until the next permitted request.
          schema:
            example: 60
            minimum: 1
            type: integer
    WriteIdempotencyConflict:
      description: The idempotency key belongs to a different write request.
      headers:
        X-Request-Id:
          required: true
          description: Correlation ID for this idempotency conflict.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/XWriteActionError'
          example:
            charged: false
            chargedCredits: '0'
            error: idempotency_conflict
            message: Idempotency-Key was already used with a different request.
            safeToRetry: true
            retryable: false
            success: false
            nextAction:
              type: retry
              requiresNewIdempotencyKey: true
    UnexpectedError:
      content:
        application/json:
          example:
            error: internal_error
            message: Unexpected error. Try again.
          schema:
            $ref: '#/components/schemas/Error'
      description: Unexpected error.
  schemas:
    XWriteActionTarget:
      type:
      - object
      - 'null'
      description: Existing X resource targeted by the write, when applicable.
      additionalProperties: false
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - tweet
          - user
          - community
        id:
          type: string
    GuestWalletTopupCheckoutAction:
      description: Explicit direct REST action for a guest wallet top-up.
      type: object
      additionalProperties: false
      required:
      - account_required
      - amount_bounds
      - body
      - creates
      - method
      - path
      - provider
      - required_headers
      - requires_authentication
      - requires_user_confirmation
      - requires_user_interaction
      - response_fields
      - response_url_field
      properties:
        account_required:
          type: boolean
          const: false
        amount_bounds:
          $ref: '#/components/schemas/GuestWalletAmountBounds'
        body:
          $ref: '#/components/schemas/GuestWalletPurchaseRequest'
        creates:
          type: string
          const: checkout_url
        method:
          type: string
          const: POST
        path:
          type: string
          const: /api/v1/guest-wallets/topups
        provider:
          type: string
          deprecated: true
          const: stripe
        required_headers:
          type: object
          additionalProperties: false
          required:
          - Idempotency-Key
          properties:
            Idempotency-Key:
              type: string
              const: <cryptographically random UUID v4>
        requires_authentication:
          type: boolean
          const: true
        requires_user_confirmation:
          type: boolean
          const: true
        requires_user_interaction:
          type: boolean
          const: true
        response_fields:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
          - type: string
            const: checkout_url
          - type: string
            const: status_url
          items:
            type: string
            enum:
            - checkout_url
            - status_url
        response_url_field:
          type: string
          const: checkout_url
    XWriteActionResult:
      type:
      - object
      - 'null'
      description: Confirmed result produced by the write, when available.
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - tweet
          - direct_message
          - media
          - community
          - state_change
