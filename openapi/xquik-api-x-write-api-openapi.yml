  /api/v1/x/media:
    post:
      operationId: uploadMedia
      x-write-action: upload_media
      summary: Upload media
      tags:
      - X Write
      security:
      - apiKey: []
      - oauthBearer: []
      parameters:
      - $ref: '#/components/parameters/WriteIdempotencyKey'
      requestBody:
        required: true
        description: Upload media with multipart form data, or provide a JSON URL for server-side download.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - account
              - file
              properties:
                account:
                  type: string
                  description: X account (@username or ID) uploading media
                  example: '@elonmusk'
                file:
                  type: string
                  format: binary
                  description: Media file to upload
                  example: binary-content
                is_long_video:
                  type: boolean
                  description: Set true only for video/mp4 multipart uploads longer than 140 seconds.
                  example: false
            example:
              account: '@elonmusk'
              file: file_value
              is_long_video: true
          application/json:
            schema:
              type: object
              required:
              - account
              - url
              properties:
                account:
                  type: string
                  description: X account (@username or ID) uploading media from URL
                  example: '@elonmusk'
                url:
                  type: string
                  format: uri
                  description: HTTPS URL to download and upload as media
                  example: https://example.com/image.png
            example:
              account: '@elonmusk'
              url: https://example.com/image.png
