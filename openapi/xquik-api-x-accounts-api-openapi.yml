                - x_api_unavailable
                - x_api_unauthorized
                - x_auth_failure
                - x_content_too_long
                - x_daily_limit
                - x_dm_not_allowed
                - x_duplicate_action
                - x_login_auth_failed
                - x_login_challenge
                - x_login_denied
                - x_login_failed
                - x_login_proxy_error
                - x_login_rate_limited
                - x_login_service_unavailable
                - x_login_suspended
                - x_rate_limited
                - x_rejected
                - x_target_not_found
                - x_transient_error
                - x_user_lookup_failed
                - x_write_ambiguous
                - x_write_failed
        message:
          type: string
          description: Human-readable error guidance.
        reason:
          type: string
          description: Machine-readable reason for a login cooldown.
        retryAfter:
          type: integer
          minimum: 1
          description: Seconds until the next permitted request.
        retryAfterMs:
          type: integer
          minimum: 1
          description: Required wait in milliseconds.
    XAccountConnectionContinuation:
      description: The connection is still running or needs an email code.
      oneOf:
      - $ref: '#/components/schemas/XAccountConnectionAttemptPending'
      - $ref: '#/components/schemas/XAccountConnectionChallenge'
      discriminator:
        propertyName: status
        mapping:
          pending: '#/components/schemas/XAccountConnectionAttemptPending'
          requires_email_code: '#/components/schemas/XAccountConnectionChallenge'
    SanitizedXAccount:
      description: Sanitized X account summary returned by connect and reauth.
      type: object
      required:
      - id
      - xUserId
      - xUsername
      - status
      - health
      - createdAt
      properties:
        id:
          type: string
        xUserId:
          type: string
        xUsername:
          type: string
        status:
          type: string
          const: active
        health:
          type: string
          enum:
          - healthy
          - locked
          - needsReauth
          - recovering
          - suspended
          - temporaryIssue
        createdAt:
          type: string
          format: date-time
    XAccountConnectionAttemptFailed:
      description: The connection reached a final failure.
      type: object
      additionalProperties: false
      required:
      - object
      - id
      - status
      - error
      - retryable
      properties:
        object:
          type: string
          const: x_account_connection_attempt
        id:
          type: string
        status:
          type: string
          const: failed
        error:
          type: string
        reason:
          type: string
        retryable:
          type: boolean
    XAccountConnectionAttemptSuccess:
      description: The account connected successfully.
      type: object
      additionalProperties: false
      required:
      - object
      - id
      - status
      properties:
        object:
          type: string
          const: x_account_connection_attempt
        id:
          type: string
        status:
          type: string
          const: success
    XAccount:
      description: Linked X account summary with connection status, health, and timestamp metadata.
      type: object
      required:
      - id
      - xUserId
      - xUsername
      - status
      - health
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        xUserId:
          type: string
        xUsername:
          type: string
        status:
          type: string
        health:
          type: string
          description: 'Derived health. `healthy` is ready. `needsReauth` needs credentials. `locked` must be unlocked on X. `suspended` is banned. `recovering` can reconnect. Wait before using `temporaryIssue`.

            '
          enum:
          - healthy
          - locked
          - needsReauth
          - recovering
          - suspended
          - temporaryIssue
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        cookiesObtainedAt:
          type: string
          format: date-time
  responses:
    InvalidInput:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_input
            message: Invalid input. Check the request body.
    ConnectLoginCooldown:
      description: 'A prior login attempt triggered a cooldown. Response includes `reason`, `retryAfterMs`, and a `Retry-After` header in seconds. Returns error code `login_cooldown`.

        '
      headers:
        Retry-After:
          description: Cooldown duration in seconds.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: login_cooldown
            message: Login is temporarily paused
            reason: temporary_issue
            retryAfterMs: 60000
    ConnectRateLimitExceeded:
      description: 'Too many requests. `rate_limit_exceeded` includes `retryAfter` and `Retry-After`. `login_cooldown` also includes `reason` and `retryAfterMs`.

        '
      headers:
        Retry-After:
          description: Required wait in seconds.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate_limit_exceeded
            message: Too many requests. Retry later.
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: Resource not found.
    Success:
      description: Success
      content:
        application/json:
          schema:
            type: object
            required:
            - success
            properties:
              success:
                type: boolean
                const: true
                example: true
          example:
            success: true
    ConnectLoginFailed:
      description: 'Login requires new credentials or account verification. Cooldowns include `retryAfterMs` and `Retry-After`. Codes are `login_failed` or `passkey_required`.

        '
      headers:
        Retry-After:
          description: Cooldown duration in seconds, when retrying must wait.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: login_failed
            message: Login failed. Check credentials and try again.
            retryAfterMs: 300000
    Unauthenticated:
      description: Unauthenticated
      headers:
        Cache-Control:
          description: Prevents storage of authentication responses.
          schema:
            type: string
            const: no-store
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
            const: Bearer realm="xquik"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthenticated
            message: Authentication required. Provide a valid API key or bearer token.
    ConnectServiceUnavailable:
      description: 'The X connection service is temporarily unavailable. Retry after a short delay. Returns error code `service_unavailable`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: service_unavailable
            message: Service temporarily unavailable. Try again later.
    RateLimitExceeded:
      description: 'Xquik tier rate limit exceeded. The response includes a `Retry-After` header with the number of seconds to wait before retrying.

        '
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                retryAfter:
                  type: integer
                  example: 60
          example:
            error: rate_limit_exceeded
            message: Too many requests. Try again later.
            retryAfter: 60
      headers:
        Retry-After:
          description: Seconds until the next permitted request.
          schema:
            example: 60
            minimum: 1
            type: integer
    ConnectUserLookupFailed:
      description: 'The X username could not be resolved. Verify the handle is correct and the account exists. Default v1 returns 502. The best-practice response contract returns 424. Error code: `x_user_lookup_failed`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: x_user_lookup_failed
            message: X username lookup failed. Try again later.
    ReauthAccountNotFound:
      description: 'No X account with this ID belongs to the authenticated user. Returns error code `account_not_found`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: account_not_found
            message: X account not found.
    ConnectAlreadyConnected:
      description: 'The specified X account is already connected to this Xquik account. Returns error code `account_already_connected`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: account_already_connected
            message: This X account is already connected.
    UnexpectedError:
      content:
        application/json:
          example:
            error: internal_error
            message: Unexpected error. Try again.
          schema:
            $ref: '#/components/schemas/Error'
      description: Unexpected error.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource ID returned by the matching create or list endpoint.
    ConnectionAttemptId:
      name: id
      in: path
      required: true
      description: Connection attempt ID returned by `POST /x/accounts`.
      schema:
        type: string
        pattern: ^xatt_[0-9a-f]{32}$
        example: xatt_0123456789abcdef0123456789abcdef
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: 'Xquik API key passed through the x-api-key header. Xquik-Api-Key is a vendor-prefixed alias. API keys beginning with xq_ can also use Authorization: Bearer.'
    oauthBearer:
      type: http
      scheme: bearer
      description: 'OAuth 2.1 access token passed through Authorization: Bearer. Values beginning with xq_ remain Xquik API-key credentials, not OAuth tokens.'
    cookieSession:
      type: apiKey
      in: cookie
      name: __Host-xquik_session
      description: Secure Xquik browser session cookie.
x-service-info:
  categories:
  - data
  docs:
    homepage: https://xquik.com
    apiReference: https://docs.xquik.com
    llms: https://docs.xquik.com/llms.txt
x-discovery:
  ownershipProofs:
  - dns:xquik.com
