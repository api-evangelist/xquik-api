openapi: 3.2.0
info:
  title: Xquik X Accounts API
  version: '1.0'
  description: Xquik is an independent third-party service.
  x-guidance: '## Common tasks


    **Find a tweet** - GET /x/tweets/{id}. Returns text, author, metrics, media, and creation time. Cost: $0.00015 per lookup.


    **Search tweets** - GET /x/tweets/search?q={query}&limit={n}. Supports X operators, structured filters, Tweet IDs, and status URLs. Omit mode for automatic coverage. Cost: $0.00015 per returned tweet.


    **Find a user** - GET /x/users/{id}. Accepts an ID or username. Cost: $0.00015 per lookup.


    **Check if A follows B** - GET /x/followers/check?source={a}&target={b}. Accepts usernames or profile URLs. Cost: $0.00075.


    **Get trends** - GET /trends?woeid={region}&count={n}. WOEID 1 is worldwide. Cost: $0.00045.


    **Download media** - POST /x/media/download with `tweetIds`. Fresh Tweets cost 1 credit each. Cached repeats are free.


    **Read an article** - GET /x/articles/{tweetId}. Cost: $0.00075.


    ## Pagination


    Default platform pages return `hasMore` and `nextCursor`. X pages return `has_next_page` and `next_cursor`. The 2026-04-29 contract returns `has_more` and `next_cursor`. Pass cursors through `cursor`; `after` remains compatible. Dynamic pricing counts returned items, not requests.


    Omit `mode` for automatic reads. Pass cursors unchanged. `mode=standard` remains legacy. Retry 409 responses after `Retry-After`. Restart 410 responses without a cursor.


    ## Authentication


    Eligible reads accept guest wallets. Fixed-price lookups also accept MPP. Other features require an API key or OAuth 2.1 bearer token. API keys also support `Authorization: Bearer xq_...`.


    ## Best-Practice Response Contract


    v1 remains the default. Send `xquik-api-contract: 2026-04-29` for snake_case, Unix timestamps, structured errors, unified pagination, resource objects, and prefixed IDs. Dependency failures use 424 instead of 502.'
  contact:
    name: Xquik
    url: https://xquik.com
    email: support@xquik.com
servers:
- url: https://xquik.com
security:
- apiKey: []
- oauthBearer: []
tags:
- name: X Accounts
  description: Connected X account management
paths:
  /api/v1/x/accounts:
    get:
      operationId: listXAccounts
      summary: List connected X accounts
      tags:
      - X Accounts
      security:
      - apiKey: []
      - oauthBearer: []
      responses:
        '200':
          description: X account list
          content:
            application/json:
              schema:
                type: object
                required:
                - accounts
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/XAccount'
                    example:
                    - id: '42'
                      xUserId: '9876543210'
                      xUsername: elonmusk
                      status: active
                      health: healthy
                      createdAt: '2025-01-15T12:00:00Z'
                      updatedAt: '2025-03-10T08:30:00Z'
              example:
                accounts:
                - id: '42'
                  xUserId: '9876543210'
                  xUsername: elonmusk
                  status: active
                  health: healthy
                  createdAt: '2025-01-15T12:00:00Z'
                  updatedAt: '2025-03-10T08:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: List connected X accounts.
    post:
      operationId: connectXAccount
      summary: Connect X account
      tags:
      - X Accounts
      security:
      - apiKey: []
      - oauthBearer: []
      requestBody:
        required: true
        description: X credentials (username, email, password) and the Authenticator App 2FA secret required for a durable connection.
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - email
              - password
              - totp_secret
              properties:
                username:
                  type: string
                  description: X username
                  example: your_x_username
                email:
                  type: string
                  description: Account email
                  example: account@example.invalid
                password:
                  type: string
                  description: Account password
                  example: <ACCOUNT_PASSWORD>
                totp_secret:
                  type: string
                  description: Authenticator App TOTP secret required for durable login
                  example: <TOTP_SECRET>
            example:
              username: your_x_username
              email: account@example.invalid
              password: <ACCOUNT_PASSWORD>
              totp_secret: <TOTP_SECRET>
      responses:
        '201':
          description: X account connected after verification
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/SanitizedXAccount'
                x-stainless-override-schema:
                  x-stainless-naming:
                    csharp:
                      type_name: AccountCreateResponse
                  oneOf:
                  - $ref: '#/components/schemas/SanitizedXAccount'
                  - $ref: '#/components/schemas/XAccountConnectionContinuation'
        '202':
          description: Connection continues or needs an email code
          headers:
            Cache-Control:
              description: Prevents caching. Present when the response status is `pending`.
              schema:
                type: string
                const: no-store
            Location:
              description: Status URL. Present when the response status is `pending`.
              schema:
                type: string
                example: /api/v1/x/account-connection-attempts/xatt_0123456789abcdef0123456789abcdef
            Retry-After:
              description: Seconds before checking again. Present when the response status is `pending`.
              schema:
                type: integer
                minimum: 0
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XAccountConnectionContinuation'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/ConnectAlreadyConnected'
        '422':
          $ref: '#/components/responses/ConnectLoginFailed'
        '429':
          $ref: '#/components/responses/ConnectRateLimitExceeded'
        '502':
          $ref: '#/components/responses/ConnectUserLookupFailed'
        '503':
          $ref: '#/components/responses/ConnectServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Connect X account.
  /api/v1/x/account-connection-attempts/{id}:
    get:
      operationId: getXAccountConnectionAttempt
      summary: Get X account connection status
      tags:
      - X Accounts
      security:
      - apiKey: []
      - oauthBearer: []
      parameters:
      - $ref: '#/components/parameters/ConnectionAttemptId'
      responses:
        '200':
          description: Current X account connection status
          headers:
            Cache-Control:
              description: Prevents caching of connection status.
              schema:
                type: string
                const: no-store
            Retry-After:
              description: Seconds before checking again. Present when the response status is `pending`.
              schema:
                type: integer
                minimum: 0
                example: 3
          content:
            application/json:
              schema:
                x-stainless-naming:
                  csharp:
                    type_name: AccountConnectionAttemptRetrieveResponse
                oneOf:
                - $ref: '#/components/schemas/XAccountConnectionAttemptPending'
                - $ref: '#/components/schemas/XAccountConnectionAttemptSuccess'
                - $ref: '#/components/schemas/XAccountConnectionAttemptFailed'
                - $ref: '#/components/schemas/XAccountConnectionChallenge'
                discriminator:
                  propertyName: status
                  mapping:
                    pending: '#/components/schemas/XAccountConnectionAttemptPending'
                    success: '#/components/schemas/XAccountConnectionAttemptSuccess'
                    failed: '#/components/schemas/XAccountConnectionAttemptFailed'
                    requires_email_code: '#/components/schemas/XAccountConnectionChallenge'
              example:
                object: x_account_connection_attempt
                id: xatt_0123456789abcdef0123456789abcdef
                status: pending
                pollAfterMs: 3000
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Get X account connection status.
  /api/v1/x/account-connection-challenges/{id}/submit:
    post:
      operationId: submitXAccountConnectionChallenge
      summary: Submit X account email verification code
      tags:
      - X Accounts
      security:
      - apiKey: []
      - oauthBearer: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        description: Email verification code requested during account connect.
        content:
          application/json:
            schema:
              type: object
              required:
              - email_code
              properties:
                email_code:
                  type: string
                  description: Code sent to the account email.
                  example: <EMAIL_VERIFICATION_CODE>
            example:
              email_code: <EMAIL_VERIFICATION_CODE>
      responses:
        '201':
          description: X account connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanitizedXAccount'
        '202':
          description: Email verification code required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XAccountConnectionChallenge'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Verification challenge is no longer active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: connection_challenge_inactive
                message: Connection challenge is no longer active.
        '410':
          description: Verification code expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: connection_challenge_expired
                message: Verification code expired. Start again.
        '422':
          $ref: '#/components/responses/ConnectLoginFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ConnectServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Submit X account email verification code.
  /api/v1/x/accounts/{id}:
    get:
      operationId: getXAccount
      summary: Get X account details
      tags:
      - X Accounts
      security:
      - apiKey: []
      - oauthBearer: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: X account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XAccountDetail'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Get X account details.
    delete:
      operationId: disconnectXAccount
      summary: Disconnect X account
      tags:
      - X Accounts
      security:
      - apiKey: []
      - oauthBearer: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Disconnect X account.
  /api/v1/x/accounts/{id}/reauth:
    post:
      operationId: reauthXAccount
      summary: Re-authenticate X account
      tags:
      - X Accounts
      security:
      - apiKey: []
      - oauthBearer: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        description: Updated password and optional fields for re-authentication.
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                password:
                  type: string
                  description: Updated account password
                  example: <ACCOUNT_PASSWORD>
                totp_secret:
                  type: string
                  description: Replacement Authenticator App TOTP secret. Omit it to reuse the saved secret.
                  example: <TOTP_SECRET>
                email:
                  type: string
                  description: Email for the X account (updates stored email)
                  example: account@example.invalid
            example:
              password: <ACCOUNT_PASSWORD>
              totp_secret: <TOTP_SECRET>
              email: account@example.invalid
      responses:
        '200':
          description: Re-authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanitizedXAccount'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ReauthAccountNotFound'
        '422':
          $ref: '#/components/responses/ConnectLoginFailed'
        '429':
          $ref: '#/components/responses/ConnectLoginCooldown'
        '503':
          $ref: '#/components/responses/ConnectServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Re-authenticate X account.
  /api/v1/x/accounts/bulk-retry:
    post:
      operationId: bulkRetryXAccounts
      summary: Bulk retry temporarily failed X accounts
      description: Clears loginFailedAt and loginFailureReason for all accounts with transient or automated failure reasons, making them eligible for retry on next use.
      tags:
      - X Accounts
      security:
      - apiKey: []
      - oauthBearer: []
      responses:
        '200':
          description: Accounts cleared for retry
          content:
            application/json:
              schema:
                type: object
                required:
                - cleared
                properties:
                  cleared:
                    type: integer
                    description: Number of accounts cleared
                    example: 3
              example:
                cleared: 3
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        default:
          $ref: '#/components/responses/UnexpectedError'
components:
  schemas:
    XAccountConnectionAttemptPending:
      description: The connection is still in progress.
      type: object
      additionalProperties: false
      required:
      - object
      - id
      - status
      - pollAfterMs
      properties:
        object:
          type: string
          const: x_account_connection_attempt
        id:
          type: string
        status:
          type: string
          const: pending
        pollAfterMs:
          type: integer
          minimum: 0
    XAccountConnectionChallenge:
      description: Resumable account connection challenge. Submit the email code to finish the same connection attempt.
      type: object
      required:
      - object
      - id
      - status
      - expiresAt
      - message
      - username
      properties:
        object:
          type: string
          const: x_account_connection_challenge
        id:
          type: string
        status:
          type: string
          const: requires_email_code
        expiresAt:
          type: string
          format: date-time
        message:
          type: string
        username:
          type: string
    XAccountDetail:
      description: Connected X account details with health and timestamp metadata.
      type: object
      required:
      - id
      - xUserId
      - xUsername
      - status
      - health
      - createdAt
      properties:
        id:
          type: string
        xUserId:
          type: string
        xUsername:
          type: string
        status:
          type: string
        health:
          type: string
          enum:
          - healthy
          - locked
          - needsReauth
          - recovering
          - suspended
          - temporaryIssue
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        cookiesObtainedAt:
          type: string
          format: date-time
    Error:
      description: 'Error response. Default v1 returns a legacy string error code. Send `xquik-api-contract: 2026-04-29` to receive the structured best-practice error object.

        '
      type: object
      required:
      - error
      properties:
        error:
          x-stainless-naming:
            python:
              type_name: ErrorValue
            java:
              type_name: ErrorValue
          oneOf:
          - type: string
            title: LegacyErrorCode
            enum:
            - internal_error
            - account_already_connected
            - account_needs_reauth
            - account_not_found
            - account_required
            - account_restricted
            - api_key_limit_reached
            - article_not_found
            - closed
            - dm_not_permitted
            - invalid_format
            - invalid_id
            - invalid_input
            - invalid_params
            - invalid_tool_type
            - invalid_tweet_id
            - invalid_tweet_url
            - invalid_user_id
            - invalid_user_ids
            - invalid_username
            - invalid_json
            - insufficient_credits
            - login_cooldown
            - login_failed
            - media_download_failed
            - missing_params
            - missing_query
            - monitor_already_exists
            - monitor_profile_unavailable
            - no_media
            - no_credits
            - no_subscription
            - not_found
            - payment_failed
            - rate_limit_exceeded
            - service_unavailable
            - style_not_found
            - subscription_inactive
            - tweet_not_found
            - unauthenticated
            - unsupported_field
            - user_not_found
            - body_too_large
            - checkout_unavailable
            - connection_challenge_expired
            - connection_challenge_inactive
            - coverage_cursor_gone
            - coverage_cursor_unavailable
            - draft_not_found
            - expired
            - favoriters_unavailable
            - forbidden
            - guest_wallet_unavailable
            - guest_wallets_disabled
            - guest_wallets_unavailable
            - idempotency_conflict
            - idempotency_key_conflict
            - invalid_community_id
            - invalid_complete_replies_request
            - invalid_coverage_cursor
            - invalid_coverage_request
            - invalid_idempotency_key
            - invalid_list_id
            - invalid_output_options
            - invalid_payment_amount
            - invalid_range
            - invalid_reply_options
            - login_rate_limited
