servers:
- url: https://xquik.com
security:
- apiKey: []
- oauthBearer: []
tags:
- name: Users
  description: Look up, search, and explore user profiles and relationships
paths:
  /api/v1/x/users/batch:
    get:
      operationId: getBatchUsers
      summary: Look up multiple users by IDs in one call
      tags:
      - Users
      security:
      - apiKey: []
      - oauthBearer: []
      - {}
      parameters:
      - name: ids
        in: query
        required: true
        schema:
          type: string
        description: Comma-separated numeric user IDs (1-100 values). Duplicate IDs are ignored while preserving first-seen order.
      responses:
        '200':
          description: Matched users plus reconciliation metadata for unavailable IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchUsers'
              example:
                users:
                - id: '9876543210'
                  username: elonmusk
                  name: Elon Musk
                has_next_page: false
                next_cursor: ''
                requested_count: 2
                processed_count: 2
                returned_count: 1
                unavailable_ids:
                - '1234567890'
                unprocessed_ids: []
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/AnonymousGuestAuthenticationRequired'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '424':
          $ref: '#/components/responses/XApiError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/XApiError'
        default:
          content:
            application/json:
              example:
                error: internal_error
                message: Unexpected error. Try again.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error.
      description: Look up multiple users by IDs in one call.
  /api/v1/x/users/search:
    get:
      operationId: searchUsers
      summary: Search users by name or username
      tags:
      - Users
      security:
      - apiKey: []
      - oauthBearer: []
      - {}
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: User search query
      - name: cursor
        in: query
        schema:
          type: string
        description: Pagination cursor for user search
      responses:
        '200':
          description: User search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/AnonymousGuestAuthenticationRequired'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '424':
          $ref: '#/components/responses/XApiError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/XApiError'
        default:
          content:
            application/json:
              example:
                error: internal_error
                message: Unexpected error. Try again.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error.
      description: Search users by name or username.
  /api/v1/x/users/{id}:
    get:
      operationId: getUser
      summary: Get user profile with follower counts and verification
      tags:
      - Users
      security:
      - apiKey: []
      - oauthBearer: []
      - {}
      x-payment-info:
        offers:
        - amount: '150'
          currency: '0x20c000000000000000000000b9537d11c60e8b50'
          intent: charge
          method: tempo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: X username (without @) or user ID
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: '9876543210'
                username: elonmusk
                name: Elon Musk
                description: CEO of Tesla, SpaceX, and X
                followers: 150000000
                following: 500
                verified: true
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: user_not_found
                message: X user not found. Check the username.
        '424':
          $ref: '#/components/responses/XApiError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/XApiError'
        default:
          content:
            application/json:
              example:
                error: internal_error
                message: Unexpected error. Try again.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error.
      description: Get user profile with follower counts and verification.
  /api/v1/x/followers/check:
    get:
      operationId: checkFollow
      summary: Check if one user follows another
      tags:
      - Users
      security:
      - apiKey: []
      - oauthBearer: []
      - {}
      x-payment-info:
        offers:
        - amount: '750'
          currency: '0x20c000000000000000000000b9537d11c60e8b50'
          intent: charge
          method: tempo
      parameters:
      - name: source
        in: query
        required: true
        schema:
          type: string
        description: Source username, @username, or X or Twitter profile URL
      - name: target
        in: query
        required: true
        schema:
          type: string
        description: Target username, @username, or X or Twitter profile URL
      responses:
        '200':
          description: Follow check result
          content:
            application/json:
              schema:
                type: object
                required:
                - isFollowing
                - isFollowedBy
                - sourceUsername
                - targetUsername
                properties:
                  isFollowing:
                    type: boolean
                    example: true
                  isFollowedBy:
                    type: boolean
                    example: false
                  sourceUsername:
                    type: string
                    example: elonmusk
                  targetUsername:
                    type: string
                    example: jack
              example:
                isFollowing: true
                isFollowedBy: false
                sourceUsername: elonmusk
                targetUsername: jack
        '400':
          description: Missing or invalid params
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: missing_params
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '424':
          $ref: '#/components/responses/XApiError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/XApiError'
        default:
          content:
            application/json:
              example:
                error: internal_error
                message: Unexpected error. Try again.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error.
      description: Check if one user follows another.
  /api/v1/x/users/{id}/tweets:
    get:
      operationId: getUserTweets
      summary: List recent tweets posted by a user
      tags:
      - Users
      security:
      - apiKey: []
