description: >-
  Binds Xquik's MCP tools to the OpenAPI operations behind them. Xquik ships a code-mode
  MCP server, not a tool-per-operation one: two tools front a scoped route catalog, so the
  crosswalk is deliberately one-to-many. That shape matters for agent readiness — a client
  cannot read a tool name and know what it may call; it must first run `explore` against
  `spec.endpoints`, and the real input contract of any call is the OpenAPI operation's own
  parameters and requestBody.
