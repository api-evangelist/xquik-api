crosswalk:
- tool: xquik
  server: https://xquik.com/mcp
  category: api-execution
  binding: rest
  rest: [all-catalog-routes]
  confidence: high
  note: >-
    Generic dispatcher. `xquik.request(path, { method, body, query })` executes any route
    the authenticated credential is allowed to call, so it inherits the parameters and
    requestBody of whichever OpenAPI operation the path resolves to. The provider documents
    the catalog as 120 routes for a full credential (119 returning JSON or text through
    MCP) and 33 GET routes for an active guest `paid_reads` key, against 127 operations in
    the published spec. Auth and required `Idempotency-Key` headers are injected by the
    server.
- tool: explore
