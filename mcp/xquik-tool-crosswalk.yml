  category: discovery
  binding: none
  rest: []
  confidence: high
  note: >-
    Searches `spec.endpoints` in a sandbox; makes no network call and spends no credits.
    There is no REST operation that returns the catalog, so this is an MCP-only capability
    over the same OpenAPI document.
