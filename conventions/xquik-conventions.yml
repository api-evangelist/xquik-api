rate_limit_signaling:
  status: 429
  headers: [Retry-After]
  body_fields: [retryAfter, retryAfterMs]
  buckets: read 300/1s, write 120/60s, delete 60/60s (fixed window, per account)
  detail: rate-limits/xquik-rate-limits.yml
request_tracing:
  request_id_header: null
  note: >-
    No request-id/correlation header is documented for REST. Durable writes are traced
    instead by `writeActionId` + `statusUrl`, and webhook deliveries by `deliveryId` plus
    the X-Xquik-Nonce/X-Xquik-Timestamp signature headers.
async_writes:
  status: 202
  pattern: >-
    A write may return 202 with a pending action. Store writeActionId, poll statusUrl
    (GET /api/v1/x/write-actions/{id}) while `terminal` is false, and follow Retry-After /
    pollAfterMs / nextAction.
  status_operation: getWriteActionStatus
payments:
  challenge_401: Anonymous non-MPP paid reads (26 routes) return 401 WWW-Authenticate Bearer with a guest-wallet action.
  challenge_402: The 7 direct MPP reads return 402 WWW-Authenticate Payment.
  receipt_header: Payment-Receipt
  rule: Never start checkout without explicit user confirmation.
webhooks:
  signature_header: X-Xquik-Signature
  algorithm: HMAC-SHA256 over timestamp + nonce + raw body
  extra_headers: [X-Xquik-Nonce, X-Xquik-Timestamp]
  retry: up to 10 attempts, backoff 1s to 60s; 410 Gone exhausts immediately
  detail: asyncapi/xquik-asyncapi.yaml
