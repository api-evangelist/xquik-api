  - dependency failures return 424 instead of 502
  note: Default v1 keeps the legacy contract so existing integrations do not break.
error_envelope:
  default: '{ "error": "error_code", "message": "Human-readable description" }'
  opt_in: '{ "error": { "type": "...", "code": "...", "message": "..." } }'
  rfc9457: false
