authentication:
  styles:
  - type: apiKey
    header: x-api-key
    alias_header: Xquik-Api-Key
    format: xq_ + 64 hex characters
    also_accepted_as: 'Authorization: Bearer xq_...'
  - type: apiKey
    scope: guest
    note: Guest key with a fixed paid_reads scope; 33 eligible GET routes only.
  - type: http bearer
    note: OAuth 2.1 access token (authorization code + PKCE).
  - type: cookie
    name: __Host-xquik_session
    note: Browser session for same-origin dashboard routes (API key management, account update).
  - type: payment
    note: >-
      Machine Payments Protocol — 7 fixed-price GET operations accept an anonymous
      `Authorization: Payment` credential over Tempo/USDC after a 402 challenge.
  detail: authentication/xquik-api-authentication.yml
idempotency:
  supported: true
  header: Idempotency-Key
  parameter_component: '#/components/parameters/WriteIdempotencyKey'
  applies_to: >-
    Connected-account write operations (tweets, likes, retweets, follows, remove-follower,
    DMs, media upload, profile/avatar/banner updates, community create/delete/join/leave)
    and support ticket creation (#/components/parameters/SupportIdempotencyKey).
  conflict_status: 409
  conflict_codes: [idempotency_key_conflict, idempotency_conflict, invalid_idempotency_key, missing_idempotency_key]
  conflict_response: '#/components/responses/WriteIdempotencyConflict'
  retry_rule: >-
    Retry a write only when `safeToRetry` is true, and use a NEW Idempotency-Key on the
    retry. Reusing a key with different content returns 409.
  key_format: UUID v4 (guest wallet flows document UUID v4 idempotency keys as secrets)
  injected_by_mcp: true
  evidence: 22 operations reference WriteIdempotencyKey/SupportIdempotencyKey in the published spec.
pagination:
  default_contract:
    style: cursor
    response_fields_platform: [hasMore, nextCursor]
    response_fields_x_data: [has_next_page, next_cursor]
    request_params: [after, afterCursor, cursor]
    note: >-
      Send nextCursor as `after` for events, draws and extractions; `afterCursor` for
      drafts. Monitors, webhooks and API keys return up to 200 unpaginated items.
  opt_in_contract:
    response_fields: [has_more, next_cursor]
    request_params: [cursor, after, afterCursor]
  opaque_cursors: true
  page_size_max: 200
  stale_cursor: 409 busy (honor Retry-After, retry once) / 410 gone (restart cursorless and dedupe IDs)
versioning:
  scheme: uri-path
  current: v1
  contract_header: xquik-api-contract
  contract_value: '2026-04-29'
  opt_in_changes:
  - snake_case response fields
  - date-time fields as Unix seconds
  - 'structured error object { error: { type, code, message } }'
  - has_more / next_cursor pagination fields
