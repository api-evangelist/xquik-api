name: Xquik
description: >-
  Xquik is an independent third-party X data and automation platform. It
  provides public data reads, connected-account write actions, monitoring,
  signed webhooks, exports, hosted MCP servers, OAuth 2.1, API keys, 8 SDKs, a
  CLI, Agent Skills, and an OpenAPI 3.1 contract. Not affiliated with X Corp.
url: https://raw.githubusercontent.com/api-evangelist/xquik-api/refs/heads/main/apis.yml
image: https://xquik.com/logo-square.png
created: '2026-04-14'
modified: '2026-08-01'
specificationVersion: '0.21'
tags:
  - social media data
  - X / Twitter
  - social listening
  - data extraction
  - automation
  - webhooks
  - MCP
  - developer API
apis:
  - name: Xquik REST API
    description: >-
      OpenAPI 3.1 REST API for public X data, connected-account write actions,
      monitoring, signed webhooks, exports, account management, and billing.
    humanURL: https://docs.xquik.com/api-reference/overview
    baseURL: https://xquik.com/api/v1
    tags:
      - REST
      - OpenAPI
      - webhooks
      - automation
    properties:
      - type: OpenAPI
        url: https://xquik.com/openapi.json
      - type: Documentation
        url: https://docs.xquik.com
      - type: APIReference
        url: https://docs.xquik.com/api-reference/overview
      - type: Authentication
        url: https://docs.xquik.com/api-reference/authentication
  - name: Xquik API MCP Server
    description: >-
      Hosted MCP server for the Xquik API with OAuth 2.1 and API-key access.
    humanURL: https://docs.xquik.com/mcp/overview
    baseURL: https://xquik.com/mcp
    tags:
      - MCP
      - agents
      - automation
    properties:
      - type: MCPServer
        url: mcp/xquik-mcp.yml
      - type: Authentication
        url: https://xquik.com/auth.md
  - name: Xquik Docs MCP Server
    description: >-
      Read-only hosted MCP server for searching Xquik documentation.
    humanURL: https://docs.xquik.com/mcp/overview
    baseURL: https://docs.xquik.com/mcp
    tags:
      - MCP
      - documentation
      - agents
    properties:
      - type: MCPServer
        url: https://docs.xquik.com/mcp
      - type: Documentation
        url: https://docs.xquik.com
