  policy_summary: >-
    v1 behaviour is preserved where practical; breaking changes are announced in the public
    changelog before release; deprecated operations stay documented through their transition
    window; urgent security or legal changes may be immediate.
  changelog: https://docs.xquik.com/changelog
  sunset_header: false
