format: vendor-envelope
rfc9457: false
description: >-
  Xquik does not use RFC 9457 problem+json. Every REST error returns a vendor envelope whose
  machine-readable code is `error` (or `error.code` under the opt-in 2026-04-29 contract).
  The status classes below are derived from the 4xx/5xx responses in the published OpenAPI
  and enriched with the retry semantics the error-handling guide states. The full public
  code registry is the `Error` schema enum, reproduced at the end of this file.
envelope:
  default: '{ "error": "error_code", "message": "Human-readable description" }'
  opt_in: '{ "error": { "type": "...", "code": "...", "message": "..." } }'
  opt_in_header: 'xquik-api-contract: 2026-04-29'
  optional_fields: [message, reason, retryAfter, retryAfterMs, payment_options]
