write_lifecycle:
  status: 202
  fields: [writeActionId, status, terminal, charged, retryable, safeToRetry, statusUrl, nextAction]
  poll_operation: getWriteActionStatus
  rule: >-
    A 202 write can remain pending. Store writeActionId and poll statusUrl while `terminal`
    is false. Retry only when `safeToRetry` is true, with a new Idempotency-Key.
  notable_codes:
  - code: x_write_ambiguous
    status: 202
    meaning: Dispatch occurred but confirmation is pending.
    action: Poll statusUrl; do not retry while terminal or safeToRetry is false.
  - code: x_daily_limit
    status: 429
    meaning: The connected X account reached its daily posting limit.
    action: Wait 24 hours; not retryable.
